<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiHive - Team Collaboration Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #1A1A2E; }
        .hidden { display: none; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        .modal-content { transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
        .modal.open .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .modal .modal-content { transform: scale(0.95) translateY(10px); opacity: 0; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scale-up { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .animate-scale-up { animation: scale-up 0.3s ease-out forwards; }
        @keyframes pulse-sync {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }
        .animate-pulse-sync { animation: pulse-sync 2s infinite; }
        @keyframes slide-in-right { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-in-right { animation: slide-in-right 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Prevent blinking/flashing */
        .login-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #f1f5f9;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script>
        // --- CONSTANTS ---
        const TEAM_MAPPING = {
            'Administrator': { name: 'Administrator', color: 'bg-red-500', avatar: 'AD', role: 'System Administration' },
            'Full-Stack': { name: 'Full-Stack', color: 'bg-blue-600', avatar: 'FS', role: 'Development Team' },
            'UI/UX': { name: 'UI/UX', color: 'bg-purple-600', avatar: 'UX', role: 'Design Team' },
            'Marketing': { name: 'Marketing', color: 'bg-green-500', avatar: 'MK', role: 'Marketing Team' },
            'Support': { name: 'Support', color: 'bg-teal-500', avatar: 'ST', role: 'Support Team' },
            'Content': { name: 'Content', color: 'bg-orange-500', avatar: 'CT', role: 'Content Team' },
        };
        
        const PAGE_TITLES = {
            dashboard: 'Dashboard',
            tasks: 'My Tasks - Full List',
            submissions: 'Past Submissions Archive',
            team: 'Team Directory',
            settings: 'Settings'
        };
        
        const PAGE_ICONS = {
            dashboard: 'fa-chart-line',
            tasks: 'fa-tasks',
            submissions: 'fa-file-archive',
            team: 'fa-users',
            settings: 'fa-cog'
        };

        const ADMIN_CODE = '212259497';

        // --- BACKEND SERVICE WITH /api ENDPOINTS ---
        class BackendService {
            constructor() {
                this.baseURL = '/api';
                this.listeners = new Map();
                this.pollingIntervals = new Map();
                this.currentUser = null;
                this.isInitialized = false;
            }

            setCurrentUser(user) {
                this.currentUser = user;
            }

            async getUsers() {
                try {
                    const response = await fetch(`${this.baseURL}/users`);
                    if (!response.ok) throw new Error('Failed to fetch users');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching users:', error);
                    return [];
                }
            }

            async updateUser(username, updates) {
                try {
                    const response = await fetch(`${this.baseURL}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, updates, action: 'update' })
                    });
                    if (!response.ok) throw new Error('Failed to update user');
                    return await response.json();
                } catch (error) {
                    console.error('Error updating user:', error);
                    throw error;
                }
            }

            async registerUser(userData, adminCode) {
                try {
                    const response = await fetch(`${this.baseURL}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'register', 
                            userData: userData,
                            adminCode: adminCode
                        })
                    });
                    
                    if (response.ok) {
                        return await response.json();
                    } else {
                        const error = await response.json();
                        throw new Error(error.error || 'Registration failed');
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    throw error;
                }
            }

            async loginUser(username, password) {
                try {
                    console.log('Attempting login for:', username);
                    const response = await fetch(`${this.baseURL}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            action: 'login', 
                            username: username, 
                            password: password 
                        })
                    });
                    
                    console.log('Login response status:', response.status);
                    
                    if (response.ok) {
                        const user = await response.json();
                        console.log('Login successful for:', user.username);
                        return user;
                    } else {
                        const errorText = await response.text();
                        console.log('Login failed with response:', errorText);
                        try {
                            const errorData = JSON.parse(errorText);
                            throw new Error(errorData.error || 'Login failed');
                        } catch (e) {
                            throw new Error('Server error: ' + errorText.substring(0, 100));
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    throw error;
                }
            }

            async getComments() {
                try {
                    const response = await fetch(`${this.baseURL}/comments`);
                    if (!response.ok) throw new Error('Failed to fetch comments');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching comments:', error);
                    return [];
                }
            }

            async addComment(comment) {
                try {
                    const response = await fetch(`${this.baseURL}/comments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(comment)
                    });
                    if (!response.ok) throw new Error('Failed to add comment');
                    const result = await response.json();
                    this.notifyListeners('comments', await this.getComments());
                    return result;
                } catch (error) {
                    console.error('Error adding comment:', error);
                    throw error;
                }
            }

            async getSubmissions() {
                try {
                    const response = await fetch(`${this.baseURL}/submissions`);
                    if (!response.ok) throw new Error('Failed to fetch submissions');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching submissions:', error);
                    return [];
                }
            }

            async addSubmission(submission) {
                try {
                    const response = await fetch(`${this.baseURL}/submissions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(submission)
                    });
                    if (!response.ok) throw new Error('Failed to add submission');
                    const result = await response.json();
                    this.notifyListeners('submissions', await this.getSubmissions());
                    return result;
                } catch (error) {
                    console.error('Error adding submission:', error);
                    throw error;
                }
            }

            async deleteSubmission(submissionId, adminCode) {
                try {
                    const response = await fetch(`${this.baseURL}/submissions`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            submissionId: submissionId,
                            adminCode: adminCode 
                        })
                    });
                    
                    if (response.ok) {
                        this.notifyListeners('submissions', await this.getSubmissions());
                        return true;
                    } else {
                        throw new Error('Failed to delete submission');
                    }
                } catch (error) {
                    console.error('Error deleting submission:', error);
                    throw error;
                }
            }

            async getTasks() {
                try {
                    const response = await fetch(`${this.baseURL}/tasks`);
                    if (!response.ok) throw new Error('Failed to fetch tasks');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                    return [];
                }
            }

            subscribe(key, callback) {
                if (!this.listeners.has(key)) this.listeners.set(key, new Set());
                this.listeners.get(key).add(callback);
                
                // Set up polling for real-time updates (every 3 seconds for most data, 1 hour for comments)
                if (!this.pollingIntervals.has(key)) {
                    const intervalTime = key === 'comments' ? 3600000 : 3000;
                    
                    const interval = setInterval(async () => {
                        try {
                            const data = await this[`get${key.charAt(0).toUpperCase() + key.slice(1)}`]();
                            this.notifyListeners(key, data);
                        } catch (error) {
                            console.error(`Error polling ${key}:`, error);
                        }
                    }, intervalTime);
                    
                    this.pollingIntervals.set(key, interval);
                }
                
                return () => {
                    this.listeners.get(key)?.delete(callback);
                    if (this.listeners.get(key)?.size === 0) {
                        const interval = this.pollingIntervals.get(key);
                        if (interval) {
                            clearInterval(interval);
                            this.pollingIntervals.delete(key);
                        }
                    }
                };
            }

            notifyListeners(key, data) { 
                if (this.listeners.has(key)) {
                    this.listeners.get(key).forEach(callback => {
                        try {
                            callback(data);
                        } catch (error) {
                            console.error('Error in listener:', error);
                        }
                    });
                }
            }

            initialize() {
                if (this.isInitialized) return;
                this.isInitialized = true;
            }
        }

        const backendService = new BackendService();

        // --- UTILITIES ---
        function createElement(tag, props, ...children) {
            const element = document.createElement(tag);
            if (props) {
                Object.keys(props).forEach(key => {
                    if (key.startsWith('on') && typeof props[key] === 'function') {
                        element.addEventListener(key.substring(2).toLowerCase(), props[key]);
                    } else if (key === 'class') {
                        element.className = props[key];
                    } else {
                        element.setAttribute(key, props[key]);
                    }
                });
            }
            children.forEach(child => {
                if (typeof child === 'string' || typeof child === 'number') {
                    element.appendChild(document.createTextNode(child));
                } else if (child) {
                    element.appendChild(child);
                }
            });
            return element;
        }

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, children, size = 'md' }) => {
            if (!isOpen) return null;
            
            const sizeClasses = { 
                sm: 'max-w-sm', 
                md: 'max-w-md', 
                lg: 'max-w-2xl', 
                xl: 'max-w-4xl' 
            };
            
            const modalContainer = createElement('div', { 
                class: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-fade-in' 
            });
            
            const modalContent = createElement('div', { 
                class: `bg-white rounded-2xl shadow-xl w-full ${sizeClasses[size]} max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-scale-up` 
            });
            
            const closeButton = createElement('button', { 
                class: 'absolute top-4 right-6 text-gray-400 hover:text-gray-600 text-2xl transition-colors', 
                onclick: onClose 
            }, '×');
            
            modalContent.appendChild(closeButton);
            
            if (Array.isArray(children)) {
                children.forEach(child => {
                    if (child) modalContent.appendChild(child);
                });
            } else if (children) {
                modalContent.appendChild(children);
            }
            
            modalContainer.appendChild(modalContent);
            modalContainer.onclick = (e) => { 
                if (e.target === modalContainer) onClose(); 
            };
            
            document.body.appendChild(modalContainer);
            return modalContainer;
        }

        // ... (rest of your components remain the same)

        // --- MAIN APP ---
        function App() {
            const root = document.getElementById('root');
            
            // App state
            let currentUser = JSON.parse(localStorage.getItem('digihive_currentUser') || 'null');
            let currentPage = 'dashboard';
            let isSidebarOpen = window.innerWidth >= 1024;
            let users = [];
            let comments = [];
            let submissions = [];
            let tasks = [];
            let isInitialized = false;
            let unsubscribers = [];

            const handleLogin = (user) => {
                currentUser = user;
                backendService.setCurrentUser(user);
                localStorage.setItem('digihive_currentUser', JSON.stringify(user));
                
                // Update user online status
                backendService.updateUser(user.username, { 
                    isOnline: true,
                    lastLogin: new Date().toISOString()
                });
                
                initializeApp();
            };
            
            const handleLogout = async () => {
                if (currentUser) {
                    await backendService.updateUser(currentUser.username, { 
                        isOnline: false, 
                        lastLogout: new Date().toISOString() 
                    });
                }
                
                // Unsubscribe from all updates
                unsubscribers.forEach(unsub => unsub());
                unsubscribers = [];
                
                currentUser = null;
                backendService.setCurrentUser(null);
                localStorage.removeItem('digihive_currentUser');
                isInitialized = false;
                
                renderLoginScreen();
            };
            
            const triggerSync = () => {
                updateUI();
            };

            const initializeApp = () => {
                if (isInitialized) return;
                
                // Subscribe to data updates
                unsubscribers = [
                    backendService.subscribe('users', (data) => {
                        users = data;
                        if (currentPage === 'team' || currentPage === 'dashboard') updateUI();
                    }),
                    backendService.subscribe('comments', (data) => {
                        comments = data;
                        if (currentPage === 'dashboard') updateUI();
                    }),
                    backendService.subscribe('submissions', (data) => {
                        submissions = data;
                        if (currentPage === 'submissions' || currentPage === 'dashboard') updateUI();
                    }),
                    backendService.subscribe('tasks', (data) => {
                        tasks = data;
                        if (currentPage === 'tasks' || currentPage === 'dashboard') updateUI();
                    })
                ];
                
                isInitialized = true;
                updateUI();
            };

            const showRegisterModal = () => {
                const teamOptions = Object.values(TEAM_MAPPING).map(team => 
                    createElement('option', { value: team.name }, team.name)
                );
                
                const modalContent = createElement('div', null,
                    createElement('h2', { class: 'text-2xl font-bold text-slate-800 mb-6' }, 'Register New Team Member'),
                    createElement('form', { class: 'space-y-4', onsubmit: handleRegister },
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Username'), 
                            createElement('input', { 
                                type: 'text', 
                                name: 'username', 
                                placeholder: 'Enter username', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                            })
                        ),
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Password'), 
                            createElement('input', { 
                                type: 'password', 
                                name: 'password', 
                                placeholder: 'Enter password', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                            })
                        ),
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Team'), 
                            createElement('select', { 
                                name: 'team', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                            }, ...teamOptions)
                        ),
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Admin Code'), 
                            createElement('input', { 
                                type: 'password', 
                                name: 'adminCode', 
                                placeholder: 'Enter admin code', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                            })
                        ),
                        createElement('button', { 
                            type: 'submit', 
                            class: 'w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2' 
                        }, 
                            createElement('i', { class: 'fas fa-user-plus' }),
                            'Register Member'
                        )
                    )
                );

                Modal({
                    isOpen: true,
                    onClose: () => {},
                    children: modalContent
                });
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const userData = {
                    username: formData.get('username'),
                    password: formData.get('password'),
                    team: formData.get('team'),
                    isOnline: false
                };
                const adminCode = formData.get('adminCode');

                try {
                    await backendService.registerUser(userData, adminCode);
                    alert('User registered successfully!');
                    // Refresh users list
                    users = await backendService.getUsers();
                    if (currentPage === 'team') updateUI();
                    // Close modal
                    document.querySelectorAll('.fixed.inset-0.bg-black').forEach(modal => modal.remove());
                } catch (error) {
                    alert(error.message);
                }
            };

            const renderPage = () => {
                if (!currentUser) {
                    renderLoginScreen();
                    return;
                }

                if (!isInitialized) {
                    initializeApp();
                }

                root.innerHTML = '';
                
                const layout = createElement('div', { class: 'flex min-h-screen bg-slate-50' });
                
                // Sidebar
                const sidebar = createElement('aside', { 
                    class: `fixed top-0 left-0 h-full w-72 bg-slate-800 text-slate-200 p-6 z-40 transform transition-transform duration-300 ease-in-out ${
                        isSidebarOpen ? 'translate-x-0' : '-translate-x-full'
                    } lg:translate-x-0 overflow-y-auto` 
                });
                
                sidebar.appendChild(
                    createElement('div', { class: 'flex items-center gap-3 mb-12 px-2' },
                        createElement('div', { 
                            class: 'w-11 h-11 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg' 
                        }, 'DH'),
                        createElement('span', { class: 'text-2xl font-extrabold text-slate-200' }, 'DigiHive')
                    )
                );
                
                const navLinks = Object.keys(PAGE_TITLES).map(page => 
                    createElement('li', null,
                        createElement('a', { 
                            href: '#', 
                            class: `flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-white/10 ${
                                currentPage === page ? 'bg-blue-600 shadow-lg text-white' : 'text-slate-300'
                            }`, 
                            onclick: (e) => {
                                e.preventDefault();
                                currentPage = page;
                                if (window.innerWidth < 1024) isSidebarOpen = false;
                                updateUI();
                            } 
                        },
                            createElement('i', { class: `w-5 text-center text-lg fas ${PAGE_ICONS[page]}` }),
                            createElement('span', null, PAGE_TITLES[page])
                        )
                    )
                );
                
                sidebar.appendChild(
                    createElement('nav', null, 
                        createElement('ul', { class: 'space-y-2' }, ...navLinks)
                    )
                );

                // Add Register button to sidebar for admins
                if (currentUser.team === 'Administrator') {
                    sidebar.appendChild(
                        createElement('div', { class: 'mt-8' },
                            createElement('button', {
                                class: 'w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-colors flex items-center justify-center gap-2',
                                onclick: showRegisterModal
                            },
                                createElement('i', { class: 'fas fa-user-plus' }),
                                'Register New Member'
                            )
                        )
                    );
                }
                
                layout.appendChild(sidebar);
                
                // Overlay for mobile sidebar
                if (isSidebarOpen && window.innerWidth < 1024) {
                    layout.appendChild(
                        createElement('div', { 
                            class: 'fixed inset-0 bg-black/50 z-30 lg:hidden', 
                            onclick: () => { 
                                isSidebarOpen = false; 
                                updateUI(); 
                            } 
                        })
                    );
                }
                
                // Main content area
                const main = createElement('main', { 
                    class: `flex-1 transition-all duration-300 ease-in-out ${
                        window.innerWidth >= 1024 ? 'lg:ml-72' : ''
                    } p-6 sm:p-8 md:p-12` 
                });
                
                const header = createElement('header', { class: 'flex justify-between items-center flex-wrap gap-4' },
                    createElement('h1', { class: 'text-2xl md:text-4xl font-bold text-slate-800' }, 
                        PAGE_TITLES[currentPage] || 'Dashboard'
                    ),
                    createElement('div', { class: 'flex items-center gap-4' },
                        createElement('button', { 
                            class: 'lg:hidden text-2xl text-gray-600', 
                            onclick: () => { 
                                isSidebarOpen = !isSidebarOpen; 
                                updateUI(); 
                            } 
                        }, createElement('i', { class: 'fas fa-bars' })),
                        createElement('button', { 
                            class: 'bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-2',
                            onclick: triggerSync
                        },
                            createElement('i', { class: 'fas fa-sync-alt' }),
                            'Refresh Data'
                        ),
                        createElement('div', { class: 'flex items-center gap-3 bg-white p-2 rounded-full shadow-sm' },
                            createElement('div', { 
                                class: `w-10 h-10 rounded-full ${TEAM_MAPPING[currentUser.team].color} text-white flex items-center justify-center font-bold` 
                            }, currentUser.username.substring(0, 2).toUpperCase()),
                            createElement('span', { class: 'font-semibold text-sm hidden sm:block pr-2' }, currentUser.username)
                        ),
                        createElement('button', { 
                            title: 'Logout', 
                            class: 'text-gray-500 hover:text-red-500 text-2xl transition', 
                            onclick: handleLogout 
                        }, createElement('i', { class: 'fas fa-sign-out-alt' }))
                    )
                );
                
                const mainContentContainer = createElement('div', { class: 'mt-10' });
                
                // Render current page content
                switch(currentPage) {
                    case 'dashboard':
                        mainContentContainer.appendChild(renderDashboard());
                        break;
                    case 'tasks':
                        mainContentContainer.appendChild(renderTasks());
                        break;
                    case 'submissions':
                        mainContentContainer.appendChild(renderSubmissions());
                        break;
                    case 'team':
                        mainContentContainer.appendChild(renderTeam());
                        break;
                    case 'settings':
                        mainContentContainer.appendChild(renderSettings());
                        break;
                    default:
                        mainContentContainer.appendChild(renderDashboard());
                }
                
                main.appendChild(header);
                main.appendChild(mainContentContainer);
                layout.appendChild(main);
                
                root.appendChild(layout);
            };

            const renderLoginScreen = () => {
                root.innerHTML = '';
                
                const loginContainer = createElement('div', { 
                    class: 'login-container flex items-center justify-center p-4 animate-fade-in' 
                });
                
                const loginCard = createElement('div', { 
                    class: 'bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center animate-scale-up' 
                },
                    createElement('div', { class: 'flex justify-center items-center gap-3 mb-4' },
                        createElement('div', { 
                            class: 'w-11 h-11 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg' 
                        }, 'DH'),
                        createElement('span', { class: 'text-2xl font-extrabold text-slate-800' }, 'DigiHive')
                    ),
                    createElement('div', { class: 'my-6 p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500' },
                        createElement('p', { class: 'text-blue-700 font-medium' }, 
                            'Real-time collaborative dashboard with shared data across all teams'
                        )
                    ),
                    createElement('form', { class: 'space-y-4', onsubmit: handleLoginSubmit },
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1 text-left' }, 'Username'), 
                            createElement('input', { 
                                type: 'text', 
                                name: 'username', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500', 
                                placeholder: 'Enter your username',
                                value: 'admin' // Default for testing
                            })
                        ),
                        createElement('div', null, 
                            createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1 text-left' }, 'Password'), 
                            createElement('input', { 
                                type: 'password', 
                                name: 'password', 
                                required: true, 
                                class: 'w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500', 
                                placeholder: 'Enter your password',
                                value: 'password' // Default for testing
                            })
                        ),
                        createElement('button', { 
                            type: 'submit', 
                            class: 'w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors text-lg' 
                        }, 'Login to Dashboard')
                    ),
                    createElement('div', { class: 'mt-6 pt-4 border-t border-gray-200' },
                        createElement('button', {
                            class: 'w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-colors',
                            onclick: showRegisterModal
                        },
                            createElement('i', { class: 'fas fa-user-plus mr-2' }),
                            'Register New Team Member'
                        )
                    )
                );
                
                loginContainer.appendChild(loginCard);
                root.appendChild(loginContainer);
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const username = formData.get('username');
                const password = formData.get('password');
                
                try {
                    const user = await backendService.loginUser(username, password);
                    handleLogin(user);
                } catch (error) {
                    alert('Invalid username or password.');
                }
            };

            const renderDashboard = () => {
                const container = createElement('div', { class: 'space-y-8' });
                
                // Stats cards
                const stats = [
                    { icon: 'fa-list-check', value: tasks.filter(task => new Date(task.startDate) > new Date()).length, label: 'Upcoming Tasks', color: 'bg-blue-500' },
                    { icon: 'fa-check-double', value: submissions.length, label: 'Total Submissions', color: 'bg-violet-500' },
                    { icon: 'fa-comments', value: comments.length, label: 'Team Comments', color: 'bg-teal-500' },
                    { icon: 'fa-users', value: users.filter(u => u.isOnline).length, label: 'Online Now', color: 'bg-amber-500' },
                ];
                
                // TeamPresenceHeader and other dashboard components...
                container.appendChild(
                    createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm' },
                        createElement('h2', { class: 'text-2xl font-bold text-slate-800 mb-4' }, 'Welcome to DigiHive Dashboard'),
                        createElement('p', { class: 'text-gray-600' }, `Hello ${currentUser.username}! You are logged in as ${currentUser.team} team.`)
                    )
                );
                
                return container;
            };

            const renderTasks = () => {
                return createElement('div', { class: 'text-center p-8' }, 
                    createElement('h2', { class: 'text-2xl font-bold mb-4' }, 'Tasks'),
                    createElement('p', { class: 'text-gray-600' }, 'Tasks page coming soon...')
                );
            };

            const renderSubmissions = () => {
                return createElement('div', { class: 'text-center p-8' }, 
                    createElement('h2', { class: 'text-2xl font-bold mb-4' }, 'Submissions'),
                    createElement('p', { class: 'text-gray-600' }, 'Submissions page coming soon...')
                );
            };

            const renderTeam = () => {
                return createElement('div', { class: 'text-center p-8' }, 
                    createElement('h2', { class: 'text-2xl font-bold mb-4' }, 'Team'),
                    createElement('p', { class: 'text-gray-600' }, 'Team page coming soon...')
                );
            };

            const renderSettings = () => {
                return createElement('div', { class: 'text-center p-8' }, 
                    createElement('h2', { class: 'text-2xl font-bold mb-4' }, 'Settings'),
                    createElement('p', { class: 'text-gray-600' }, 'Settings page coming soon...')
                );
            };

            const updateUI = async () => {
                // Only load data if user is logged in and app is initialized
                if (currentUser && isInitialized) {
                    try {
                        users = await backendService.getUsers();
                        comments = await backendService.getComments();
                        submissions = await backendService.getSubmissions();
                        tasks = await backendService.getTasks();
                    } catch (error) {
                        console.error('Error loading data:', error);
                    }
                }
                
                renderPage();
            };

            // Initialize
            if (currentUser) {
                initializeApp();
            } else {
                renderLoginScreen();
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                const shouldBeOpen = window.innerWidth >= 1024;
                if (isSidebarOpen !== shouldBeOpen) {
                    isSidebarOpen = shouldBeOpen;
                    updateUI();
                }
            });

            // Update user online status on load
            if (currentUser) {
                backendService.setCurrentUser(currentUser);
                backendService.updateUser(currentUser.username, { 
                    isOnline: true,
                    lastLogin: new Date().toISOString()
                });
            }

            return {
                updateUI,
                unsubscribers
            };
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            App();
        });
    </script>
</body>
</html>
