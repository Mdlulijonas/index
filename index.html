<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiHive Team Dashboard - Live Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #F8FAFC;
        color: #1A1A2E;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scale-up {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes pulse-sync {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      @keyframes slide-in-right {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
      .animate-scale-up { animation: scale-up 0.3s ease-out forwards; }
      .animate-pulse-sync { animation: pulse-sync 2s infinite; }
      .animate-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="module">
import React from 'react';
import ReactDOM from 'react-dom/client';

const { useState, useEffect, useCallback, useMemo, StrictMode } = React;

// --- CONSTANTS ---
const ADMIN_CODE = '212259497';

const teamMapping = {
    'Administrator': { name: 'Administrator', color: 'bg-[#E53E3E]', avatar: 'AD', className: 'Administrator', role: 'System Administration' },
    'Full-Stack': { name: 'Full-Stack', color: 'bg-[#2A5CAA]', avatar: 'FS', className: 'FullStack', role: 'Development Team' },
    'UI/UX': { name: 'UI/UX', color: 'bg-[#673AB7]', avatar: 'UX', className: 'UIUX', role: 'Design Team' },
    'Marketing': { name: 'Marketing', color: 'bg-[#4CAF50]', avatar: 'MK', className: 'Marketing', role: 'Marketing Team' },
    'Support': { name: 'Support', color: 'bg-[#009688]', avatar: 'ST', className: 'Support', role: 'Support Team' },
    'Content': { name: 'Content', color: 'bg-[#FF9800]', avatar: 'CT', className: 'Content', role: 'Content Team' },
};

const pageTitles = {
    dashboard: 'Dashboard',
    tasks: 'My Tasks - Full List',
    submissions: 'Past Submissions Archive',
    team: 'Team Directory',
    settings: 'Settings'
};

// --- REAL-TIME DATABASE SIMULATION ---
class LiveDatabase {
    constructor() {
        this.users = this.loadFromStorage('digihive_live_users') || [];
        this.comments = this.loadFromStorage('digihive_live_comments') || [];
        this.submissions = this.loadFromStorage('digihive_live_submissions') || [];
        this.tasks = this.loadFromStorage('digihive_live_tasks') || this.generateInitialTasks();
        this.listeners = new Map();
        
        // Initialize with some demo data if empty
        if (this.users.length === 0) {
            this.initializeDemoData();
        }
        
        this.setupStorageSync();
    }

    initializeDemoData() {
        // Add some initial users
        const initialUsers = [
            { username: 'admin', password: 'password', team: 'Administrator', isOnline: false, lastLogin: null, lastLogout: null },
            { username: 'dev', password: 'password', team: 'Full-Stack', isOnline: false, lastLogin: null, lastLogout: null },
            { username: 'designer', password: 'password', team: 'UI/UX', isOnline: false, lastLogin: null, lastLogout: null },
            { username: 'marketer', password: 'password', team: 'Marketing', isOnline: false, lastLogin: null, lastLogout: null },
            { username: 'support', password: 'password', team: 'Support', isOnline: false, lastLogin: null, lastLogout: null },
            { username: 'writer', password: 'password', team: 'Content', isOnline: false, lastLogin: null, lastLogout: null }
        ];
        this.users = initialUsers;
        this.saveToStorage('digihive_live_users', initialUsers);
    }

    generateInitialTasks() {
        const tasks = [
            {
                id: 1,
                subject: "Platform Security Audit",
                startDate: new Date(Date.now() + 86400000).toISOString(),
                endDate: new Date(Date.now() + 172800000).toISOString(),
                description: "Complete security assessment and vulnerability testing",
                team: "Administrator",
                status: "pending"
            },
            {
                id: 2,
                subject: "API Integration Development",
                startDate: new Date(Date.now() + 432000000).toISOString(),
                endDate: new Date(Date.now() + 518400000).toISOString(),
                description: "Develop and test third-party API integrations",
                team: "Full-Stack",
                status: "pending"
            },
            {
                id: 3,
                subject: "User Interface Redesign",
                startDate: new Date(Date.now() + 259200000).toISOString(),
                endDate: new Date(Date.now() + 345600000).toISOString(),
                description: "Redesign dashboard interface for better user experience",
                team: "UI/UX",
                status: "in-progress"
            }
        ];
        this.saveToStorage('digihive_live_tasks', tasks);
        return tasks;
    }

    setupStorageSync() {
        window.addEventListener('storage', (e) => {
            if (e.key && e.key.startsWith('digihive_live_')) {
                const key = e.key;
                try {
                    const newData = JSON.parse(e.newValue || '[]');
                    const oldData = JSON.parse(e.oldValue || '[]');
                    
                    if (JSON.stringify(newData) !== JSON.stringify(oldData)) {
                        this[key] = newData;
                        this.notifyListeners(key.replace('digihive_live_', ''), newData);
                    }
                } catch (error) {
                    console.error('Error syncing storage:', error);
                }
            }
        });
    }

    loadFromStorage(key) {
        try {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : null;
        } catch (error) {
            console.error('Error loading from storage:', error);
            return null;
        }
    }

    saveToStorage(key, data) {
        try {
            localStorage.setItem(key, JSON.stringify(data));
            // Trigger storage event for other tabs
            window.dispatchEvent(new StorageEvent('storage', {
                key: key,
                newValue: JSON.stringify(data),
                oldValue: localStorage.getItem(key),
                storageArea: localStorage
            }));
        } catch (error) {
            console.error('Error saving to storage:', error);
        }
    }

    subscribe(key, callback) {
        if (!this.listeners.has(key)) {
            this.listeners.set(key, new Set());
        }
        this.listeners.get(key).add(callback);
        
        return () => {
            if (this.listeners.has(key)) {
                this.listeners.get(key).delete(callback);
            }
        };
    }

    notifyListeners(key, data) {
        if (this.listeners.has(key)) {
            this.listeners.get(key).forEach(callback => callback(data));
        }
    }

    // User methods
    async getUsers() {
        return [...this.users];
    }

    async updateUser(username, updates) {
        const userIndex = this.users.findIndex(u => u.username === username);
        if (userIndex !== -1) {
            this.users[userIndex] = { ...this.users[userIndex], ...updates };
            this.saveToStorage('digihive_live_users', this.users);
            this.notifyListeners('users', this.users);
        }
    }

    async addUser(user) {
        this.users.push(user);
        this.saveToStorage('digihive_live_users', this.users);
        this.notifyListeners('users', this.users);
    }

    async removeUser(username) {
        this.users = this.users.filter(u => u.username !== username);
        this.saveToStorage('digihive_live_users', this.users);
        this.notifyListeners('users', this.users);
    }

    // Comment methods
    async getComments() {
        return [...this.comments];
    }

    async addComment(comment) {
        const newComment = {
            ...comment,
            id: Date.now(),
            timestamp: new Date().toISOString()
        };
        this.comments.unshift(newComment);
        this.saveToStorage('digihive_live_comments', this.comments);
        this.notifyListeners('comments', this.comments);
        return newComment;
    }

    // Submission methods
    async getSubmissions() {
        return [...this.submissions];
    }

    async addSubmission(submission) {
        const newSubmission = {
            ...submission,
            id: Date.now(),
            timestamp: new Date().toISOString()
        };
        this.submissions.unshift(newSubmission);
        this.saveToStorage('digihive_live_submissions', this.submissions);
        this.notifyListeners('submissions', this.submissions);
        return newSubmission;
    }

    // Task methods
    async getTasks() {
        return [...this.tasks];
    }
}

// Create global database instance
const liveDB = new LiveDatabase();

// --- HOOKS ---
function useLiveData(key, initialValue = []) {
    const [data, setData] = useState(initialValue);

    useEffect(() => {
        // Load initial data
        const loadInitialData = async () => {
            switch (key) {
                case 'users':
                    setData(await liveDB.getUsers());
                    break;
                case 'comments':
                    setData(await liveDB.getComments());
                    break;
                case 'submissions':
                    setData(await liveDB.getSubmissions());
                    break;
                case 'tasks':
                    setData(await liveDB.getTasks());
                    break;
            }
        };
        
        loadInitialData();

        // Subscribe to changes
        const unsubscribe = liveDB.subscribe(key, setData);
        return unsubscribe;
    }, [key]);

    return data;
}

function useLocalStorage(key, initialValue) {
    const [value, setValue] = useState(() => {
        try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : initialValue;
        } catch (error) {
            return initialValue;
        }
    });

    useEffect(() => {
        localStorage.setItem(key, JSON.stringify(value));
    }, [key, value]);

    return [value, setValue];
}

// --- COMPONENTS ---
const Modal = ({ isOpen, onClose, children, size = 'md' }) => {
    useEffect(() => {
        const handleEsc = (event) => {
            if (event.key === 'Escape') onClose();
        };
        if (isOpen) window.addEventListener('keydown', handleEsc);
        return () => window.removeEventListener('keydown', handleEsc);
    }, [isOpen, onClose]);

    if (!isOpen) return null;

    const sizeClasses = {
        sm: 'max-w-sm',
        md: 'max-w-md',
        lg: 'max-w-2xl',
        xl: 'max-w-4xl',
    };

    return React.createElement('div', { 
        className: "fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-fade-in",
        onClick: onClose 
    },
        React.createElement('div', { 
            className: `bg-white rounded-2xl shadow-xl w-full ${sizeClasses[size]} max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-scale-up`,
            onClick: (e) => e.stopPropagation() 
        },
            React.createElement('button', { 
                className: "absolute top-4 right-6 text-gray-400 hover:text-gray-600 text-2xl",
                onClick: onClose 
            }, React.createElement('i', { className: "fas fa-times" })),
            children
        )
    );
};

const SyncStatusIndicator = ({ isSyncing, lastSyncTime }) => {
    return React.createElement('div', { 
        className: `fixed top-4 right-4 z-40 flex items-center gap-2 px-3 py-2 rounded-lg shadow-lg transition-all duration-300 ${
            isSyncing ? 'bg-blue-500 text-white animate-pulse-sync' : 'bg-green-500 text-white'
        } animate-slide-in-right` 
    },
        React.createElement('i', { 
            className: `fas ${isSyncing ? 'fa-sync-alt fa-spin' : 'fa-check-circle'}` 
        }),
        React.createElement('span', { className: "text-sm font-medium" },
            isSyncing ? 'Syncing...' : `Live - ${lastSyncTime}`
        )
    );
};

const TeamPresenceHeader = ({ users }) => {
    const onlineTeams = Object.values(teamMapping).filter(team => 
        users.some(user => user.team === team.name && user.isOnline)
    ).length;
    
    const totalTeams = Object.keys(teamMapping).length;
    const onlineUsers = users.filter(user => user.isOnline).length;

    return React.createElement('div', { className: "bg-white rounded-2xl p-4 shadow-sm mb-6" },
        React.createElement('div', { className: "flex items-center justify-between" },
            React.createElement('div', { className: "flex items-center gap-3" },
                React.createElement('div', { className: "flex items-center gap-2" },
                    React.createElement('div', { className: "w-3 h-3 rounded-full bg-green-500 animate-pulse" }),
                    React.createElement('span', { className: "font-bold text-slate-800" }, "Live Team Status")
                ),
                React.createElement('span', { className: "text-sm text-gray-600" }, 
                    `${onlineUsers} users online • ${onlineTeams} of ${totalTeams} teams active`
                )
            ),
            React.createElement('div', { className: "hidden md:flex items-center gap-2" },
                {Object.values(teamMapping).map(team => {
                    const isOnline = users.some(user => user.team === team.name && user.isOnline);
                    const onlineCount = users.filter(user => user.team === team.name && user.isOnline).length;
                    return React.createElement('div', { 
                        key: team.name, 
                        className: "flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-50"
                    },
                        React.createElement('div', { 
                            className: `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-green-500' : 'bg-gray-400'}` 
                        }),
                        React.createElement('span', { className: "text-sm font-medium text-slate-700" }, team.avatar),
                        isOnline && onlineCount > 1 && 
                            React.createElement('span', { className: "text-xs bg-green-500 text-white rounded-full w-5 h-5 flex items-center justify-center" }, onlineCount)
                    );
                })}
            )
        ),
        React.createElement('div', { className: "mt-3 md:hidden grid grid-cols-3 gap-2" },
            {Object.values(teamMapping).map(team => {
                const isOnline = users.some(user => user.team === team.name && user.isOnline);
                const onlineCount = users.filter(user => user.team === team.name && user.isOnline).length;
                return React.createElement('div', { 
                    key: team.name, 
                    className: "flex items-center gap-2 p-2 rounded-lg bg-gray-50 text-sm"
                },
                    React.createElement('div', { 
                        className: `w-2 h-2 rounded-full ${isOnline ? 'bg-green-500' : 'bg-gray-400'}` 
                    }),
                    React.createElement('span', { className: "font-medium text-slate-700" }, team.avatar),
                    isOnline && onlineCount > 1 && 
                        React.createElement('span', { className: "text-xs bg-green-500 text-white rounded-full w-4 h-4 flex items-center justify-center" }, onlineCount)
                );
            })}
        )
    );
};

const CommentsSection = ({ currentUser, onSyncTrigger }) => {
    const comments = useLiveData('comments', []);
    const [newComment, setNewComment] = useState('');

    const handleSubmitComment = async (e) => {
        e.preventDefault();
        if (newComment.trim() === '') return;

        await liveDB.addComment({
            username: currentUser.username,
            team: currentUser.team,
            text: newComment.trim(),
        });

        setNewComment('');
        if (onSyncTrigger) onSyncTrigger();
    };

    return React.createElement('div', { className: "bg-white rounded-2xl p-6 shadow-sm h-full flex flex-col" },
        React.createElement('div', { className: "flex items-center justify-between mb-4" },
            React.createElement('h3', { className: "text-xl font-bold text-slate-800" }, "Team Comments"),
            React.createElement('div', { className: "flex items-center gap-2 text-sm text-green-600 bg-green-50 px-2 py-1 rounded" },
                React.createElement('i', { className: "fas fa-sync-alt" }),
                React.createElement('span', null, "Live Updates")
            )
        ),
        React.createElement('form', { onSubmit: handleSubmitComment, className: "mb-4 flex gap-3" },
            React.createElement('input', {
                type: "text",
                value: newComment,
                onChange: (e) => setNewComment(e.target.value),
                placeholder: "Leave a comment about your tasks or challenges...",
                className: "flex-grow w-full border-2 border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500"
            }),
            React.createElement('button', { 
                type: "submit", 
                className: "bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2" 
            }, 
                React.createElement('i', { className: "fas fa-paper-plane" }),
                "Post"
            )
        ),
        React.createElement('div', { className: "flex-1 overflow-y-auto pr-2 space-y-4" },
            comments.length === 0 ? (
                React.createElement('div', { className: "text-center text-gray-400 pt-8" },
                    React.createElement('i', { className: "fas fa-comments text-4xl mb-2" }),
                    React.createElement('p', null, "No comments yet. Be the first to post!")
                )
            ) : (
                comments.map(comment => {
                    const commentTeamInfo = teamMapping[comment.team];
                    return React.createElement('div', { key: comment.id, className: "flex items-start gap-3" },
                        React.createElement('div', { className: `w-10 h-10 ${commentTeamInfo.color} rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` },
                            comment.username.substring(0, 2).toUpperCase()
                        ),
                        React.createElement('div', { className: "flex-1 bg-gray-50 rounded-lg p-3" },
                            React.createElement('div', { className: "flex justify-between items-baseline" },
                                React.createElement('p', { className: "font-bold text-slate-700" }, 
                                    comment.username,
                                    React.createElement('span', { className: "font-normal text-sm text-gray-500 ml-1.5" }, `(${comment.team})`)
                                ),
                                React.createElement('p', { className: "text-xs text-gray-400" }, new Date(comment.timestamp).toLocaleString())
                            ),
                            React.createElement('p', { className: "text-sm text-gray-800 mt-1" }, comment.text)
                        )
                    );
                })
            )
        )
    );
};

const Header = ({ user, onLogout, toggleSidebar, pageTitle }) => {
    return React.createElement('header', { className: "flex justify-between items-center" },
        React.createElement('div', null,
            React.createElement('h1', { className: "text-2xl md:text-4xl font-bold text-[#1A1A2E]" },
                pageTitles[pageTitle] || 'Dashboard'
            )
        ),
        React.createElement('div', { className: "flex items-center gap-4" },
            React.createElement('button', { onClick: toggleSidebar, className: "lg:hidden text-2xl text-gray-600" },
                React.createElement('i', { className: "fas fa-bars" })
            ),
            React.createElement('div', { className: "flex items-center gap-3 bg-white p-2 rounded-full shadow-sm" },
                React.createElement('div', { className: "w-10 h-10 rounded-full bg-[#2A5CAA] text-white flex items-center justify-center font-bold" },
                    user.username.substring(0, 2).toUpperCase()
                ),
                React.createElement('span', { className: "font-semibold text-sm hidden sm:block pr-2" }, user.username)
            ),
            React.createElement('button', { onClick: onLogout, className: "text-gray-500 hover:text-red-500", title: "Logout" },

            )
        )
    );
};

const Sidebar = ({ currentPage, setCurrentPage, isSidebarOpen, setSidebarOpen, users }) => {
    const handleNavClick = (page) => {
        setCurrentPage(page);
        if (window.innerWidth < 1024) setSidebarOpen(false);
    };

    const navLinks = Object.keys(pageTitles).map(page => {
        const icons = {
            dashboard: 'fa-chart-line', tasks: 'fa-tasks', submissions: 'fa-file-archive', team: 'fa-users', settings: 'fa-cog'
        };
        const isActive = currentPage === page;
        if (!icons[page]) return null;
        return React.createElement('li', { key: page },
            React.createElement('a', { href: "#", onClick: (e) => { e.preventDefault(); handleNavClick(page); }, className: `nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 text-slate-200 opacity-80 hover:bg-white/10 hover:opacity-100 ${isActive ? 'bg-[#2A5CAA] opacity-100 shadow-lg' : ''}` },
                React.createElement('i', { className: `w-5 text-center text-lg fas ${icons[page]}` }),
                React.createElement('span', null, pageTitles[page])
            )
        );
    }).filter(Boolean);

    const teamMembers = Object.values(teamMapping).map(team => {
        const isAnyMemberOnline = users.some(user => user.team === team.name && user.isOnline);
        const onlineCount = users.filter(user => user.team === team.name && user.isOnline).length;
        return React.createElement('li', { key: team.name, className: "flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/10 transition-colors duration-200" },
            React.createElement('div', { className: `w-9 h-9 ${team.color} rounded-md flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` }, team.avatar),
            React.createElement('div', { className: "flex-1" },
                React.createElement('p', { className: "text-sm font-semibold text-slate-200 leading-tight" }, team.name),
                React.createElement('p', { className: "text-xs text-slate-200 opacity-70 leading-tight" }, team.role)
            ),
            React.createElement('div', { className: "flex items-center gap-1" },
                React.createElement('div', { className: `w-2.5 h-2.5 rounded-full flex-shrink-0 transition-colors ${isAnyMemberOnline ? 'bg-green-400' : 'bg-gray-400'}` }),
                {isAnyMemberOnline && onlineCount > 0 && 
                    React.createElement('span', { className: "text-xs text-green-400" }, onlineCount)
                }
            )
        );
    });

    return React.createElement('aside', { className: `fixed top-0 left-0 h-full w-72 bg-[#1E293B] text-slate-200 p-6 z-40 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0` },
        React.createElement('div', { className: "flex items-center gap-3 mb-12 px-2" },
            React.createElement('div', { className: "w-11 h-11 bg-gradient-to-br from-[#3A7BDA] to-[#673AB7] rounded-lg flex items-center justify-center text-white font-bold text-lg" }, "DH"),
            React.createElement('span', { className: "text-2xl font-extrabold text-slate-200" }, "DigiHive")
        ),
        React.createElement('nav', null, React.createElement('ul', { className: "space-y-2" }, navLinks)),
        React.createElement('div', { className: "mt-12" },
            React.createElement('h3', { className: "text-sm font-semibold text-slate-200 opacity-70 mb-4 px-2" }, "TEAMS"),
            React.createElement('ul', { className: "space-y-2" }, teamMembers)
        )
    );
};

// --- PAGES ---
const LoginScreen = ({ onLogin }) => {
    const users = useLiveData('users', []);
    const [isLoginModalOpen, setLoginModalOpen] = useState(false);
    const [isRegisterModalOpen, setRegisterModalOpen] = useState(false);

    const handleLogin = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.currentTarget);
        const username = formData.get('username');
        const password = formData.get('password');
        
        const user = users.find(u => u.username === username && u.password === password);
        if (user) {
            await liveDB.updateUser(username, { 
                isOnline: true, 
                lastLogin: new Date().toISOString() 
            });
            onLogin({ ...user, isOnline: true });
        } else {
            alert('Invalid username or password.');
        }
    };
    
    const handleRegister = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.currentTarget);
        if (formData.get('adminCode') !== ADMIN_CODE) {
            alert('Invalid Admin Code. Registration failed.');
            return;
        }

        const username = formData.get('username');
        const password = formData.get('password');
        const team = formData.get('team');
        
        if (users.find(u => u.username === username)) {
            alert('Username already exists.');
            return;
        }

        const newUser = { 
            username, 
            password, 
            team, 
            isOnline: true,
            lastLogin: new Date().toISOString()
        };
        
        await liveDB.addUser(newUser);
        alert('Registration successful! You are now logged in.');
        setRegisterModalOpen(false);
        onLogin(newUser);
    };

    const teamOptions = Object.values(teamMapping).map(t =>

            return;
        }

        const username = formData.get('username');
        const password = formData.get('password');
        const team = formData.get('team');
        
        if (users.find(u => u.username === username)) {
            alert('Username already exists.');
            return;

        const newUser = { 
            username, 
            password, 
            team, 
            isOnline: false,
            lastLogin: null,
            lastLogout: null
        };
        
        await liveDB.addUser(newUser);
        alert('Registration successful!');
        setRegisterModalOpen(false);

            alert("You cannot deregister yourself.");

            return;

            React.createElement('button', { onClick: () => setActiveModal(modalKey), className: "bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-600 w-full md:w-auto" }, btnText)
        )
    );

    return React.createElement('div', { className: "space-y-6" },
        React.createElement(TeamPresenceHeader, { users: users }),
        
        createCard('Profile Information', 'Update your personal information.', 'Edit Profile', 'fa-user-edit', 'profile'),
        createCard('Security Settings', 'Update your password and security.', 'Update Security', 'fa-shield-alt', 'security'),
        
        React.createElement(Modal, { isOpen: activeModal === 'profile', onClose: () => setActiveModal(null) },
            React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Edit Profile"),
            React.createElement('p', { className: "text-center text-gray-500" }, "This feature is coming soon. For now, your username is ", React.createElement('strong', null, currentUser.username), " and you are on the ", React.createElement('strong', null, currentUser.team), " team.")
        ),
        
        React.createElement(Modal, { isOpen: activeModal === 'security', onClose: () => setActiveModal(null) },
            React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Update Password"),
            React.createElement('form', { onSubmit: handleUpdatePassword, className: "space-y-4" },
                React.createElement('div', null,
                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Current Password"),
                    React.createElement('input', { type: "password", name: "currentPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                ),
                React.createElement('div', null,
                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "New Password"),
                    React.createElement('input', { type: "password", name: "newPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                ),
                React.createElement('div', null,
                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Confirm New Password"),
                    React.createElement('input', { type: "password", name: "confirmPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                ),
                React.createElement('button', { type: "submit", className: "w-full mt-4 bg-green-500 text-white font-bold py-3 rounded-lg" }, "Update Password")
            )
        )
    );
};

// --- MAIN APP ---
const App = () => {
    const [currentUser, setCurrentUser] = useLocalStorage('digihive_currentUser', null);
    const [currentPage, setCurrentPage] = useState('dashboard');
    const [isSidebarOpen, setSidebarOpen] = useState(false);
    const [isSyncing, setIsSyncing] = useState(false);
    const [lastSyncTime, setLastSyncTime] = useState('just now');

    const users = useLiveData('users', []);

    const handleLogin = (user) => {
        setCurrentUser(user);
    };

    const handleLogout = useCallback(async () => {
        if (currentUser) {
            await liveDB.updateUser(currentUser.username, { 
                isOnline: false, 
                lastLogout: new Date().toISOString() 
            });
        }
        setCurrentUser(null);
    }, [currentUser]);

    const triggerSync = useCallback(() => {
        setIsSyncing(true);
        setTimeout(() => {
            setIsSyncing(false);
            const now = new Date();
            setLastSyncTime(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }, 1000);
    }, []);

    // Auto-sync every 30 seconds
    useEffect(() => {
        const interval = setInterval(triggerSync, 30000);
        return () => clearInterval(interval);
    }, [triggerSync]);

    // Update user online status
    useEffect(() => {
        if (currentUser) {
            const updateOnlineStatus = async () => {
                await liveDB.updateUser(currentUser.username, { 
                    isOnline: true,
                    lastLogin: new Date().toISOString()
                });
            };
            updateOnlineStatus();
        }
    }, [currentUser]);

    const renderPage = () => {
        if (!currentUser) return null;

        switch (currentPage) {
            case 'dashboard':
                return React.createElement(Dashboard, { 
                    currentUser, 
                    onSyncTrigger: triggerSync 
                });
            case 'submissions':
                return React.createElement(Submissions);
            case 'team':
                return React.createElement(Team, { currentUser });
            case 'settings':
                return React.createElement(Settings, { currentUser });
            default:
                return React.createElement('div', { className: "bg-white rounded-2xl p-6 shadow-sm" }, 
                    React.createElement('h2', { className: "text-2xl font-bold" }, currentPage), 
                    React.createElement('p', null, "Page not found.")
                );
        }
    };

    if (!currentUser) {
        return React.createElement(LoginScreen, { onLogin: handleLogin });
    }

    return React.createElement('div', { className: "flex min-h-screen bg-[#F8FAFC] text-[#1A1A2E]" },
        React.createElement(Sidebar, { 
            currentPage, 
            setCurrentPage, 
            isSidebarOpen, 
            setSidebarOpen, 
            users: users 
        }),
        React.createElement('div', {
            className: `fixed inset-0 bg-black/50 z-30 lg:hidden ${isSidebarOpen ? 'block' : 'hidden'}`,
            onClick: () => setSidebarOpen(false)
        }),
        React.createElement('main', { className: "flex-1 transition-all duration-300 ease-in-out lg:ml-72 p-6 sm:p-8 md:p-12" },
            React.createElement(Header, { 
                user: currentUser, 
                onLogout: handleLogout, 
                toggleSidebar: () => setSidebarOpen(!isSidebarOpen),
                pageTitle: currentPage
            }),
            React.createElement('div', { className: "mt-10" },
                renderPage()
            )
        ),
        React.createElement(SyncStatusIndicator, { 
            isSyncing: isSyncing, 
            lastSyncTime: lastSyncTime 
        })
    );
};

// --- RENDER ---
const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  React.createElement(StrictMode, null,
    React.createElement(App, null)
  )
);

</script>

</body>
</html>
