<script type="module">
import { GoogleGenAI } from "@google/genai";
import React from 'react';
import ReactDOM from 'react-dom/client';

const { useState, useEffect, useCallback, useMemo, StrictMode } = React;

// --- CONSTANTS ---
const ADMIN_CODE = '212259497';

const MASTER_USERS = [
    { username: 'admin', password: 'password', team: 'Administrator', isOnline: false },
    { username: 'dev', password: 'password', team: 'Full-Stack', isOnline: false },
    { username: 'designer', password: 'password', team: 'UI/UX', isOnline: false },
    { username: 'marketer', password: 'password', team: 'Marketing', isOnline: false },
    { username: 'support_agent', password: 'password', team: 'Support', isOnline: false },
    { username: 'writer', password: 'password', team: 'Content', isOnline: false },
];

const CSV_DATA = `Subject,Start Date,Start Time,End Date,End Time,Description,Location
Administrator Q1 Budget Review,2026-01-15,10:00,2026-01-15,12:00,Review and approve Q1 budget submissions from all teams,Remote
Administrator Security Audit,2026-01-16,14:00,2026-01-16,16:00,Perform annual security audit of the platform,Remote
Full-stack Server Setup,2026-01-13,09:00,2026-01-13,11:00,Set up cloud server environment and configure database architecture,Remote
Full-stack Database Design,2026-01-14,09:00,2026-01-14,11:00,Design database schemas and implement data migration scripts,Remote
UI/UX Design System,2026-01-13,11:00,2026-01-13,13:00,Create brand color palette and build component library,Remote
UI/UX Wireframes,2026-01-14,11:00,2026-01-14,13:00,Create homepage wireframes and design user onboarding flow,Remote
Marketing Research,2026-01-13,14:00,2026-01-13,16:00,Research competitor platforms and analyze pricing strategies,Remote
Marketing Audience Analysis,2026-01-14,14:00,2026-01-14,16:00,Define user personas and create audience segmentation,Remote
Support Helpdesk,2026-01-13,16:00,2026-01-13,17:30,Set up ticketing system and configure automation rules,Remote
Support Documentation,2026-01-14,16:00,2026-01-14,17:30,Create documentation structure and develop FAQ templates,Remote
Content Planning,2026-01-13,13:00,2026-01-13,15:00,Plan 3-month content calendar and research trending topics,Remote
Content Setup,2026-01-14,13:00,2026-01-14,15:00,Set up blog platform and create social media accounts,Remote`;

const teamMapping = {
    'Administrator': { name: 'Administrator', color: 'bg-[#E53E3E]', avatar: 'AD', className: 'Administrator', role: 'System Administration' },
    'Full-Stack': { name: 'Full-Stack', color: 'bg-[#2A5CAA]', avatar: 'FS', className: 'FullStack', role: 'Development Team' },
    'UI/UX': { name: 'UI/UX', color: 'bg-[#673AB7]', avatar: 'UX', className: 'UIUX', role: 'Design Team' },
    'Marketing': { name: 'Marketing', color: 'bg-[#4CAF50]', avatar: 'MK', className: 'Marketing', role: 'Marketing Team' },
    'Support': { name: 'Support', color: 'bg-[#009688]', avatar: 'ST', className: 'Support', role: 'Support Team' },
    'Content': { name: 'Content', color: 'bg-[#FF9800]', avatar: 'CT', className: 'Content', role: 'Content Team' },
};

const MOTIVATION_QUOTES = [
    "Every line of code you write brings us closer to empowering creators worldwide.",
    "Your energy and focus today will build the foundation for tomorrow's achievements.",
    "Collaboration multiplies our impact - together we achieve extraordinary results.",
    "Small consistent efforts lead to massive accomplishments over time.",
    "Your unique perspective adds value that no one else can contribute.",
    "Challenges are opportunities in disguise - embrace them with enthusiasm."
];

const pageTitles = {
    dashboard: 'Dashboard',
    tasks: 'My Tasks - Full List',
    calendar: 'Calendar',
    progress: 'Progress Analytics',
    submissions: 'Past Submissions Archive',
    team: 'Team Directory',
    settings: 'Settings'
};

// --- HOOKS ---
function useLocalStorage(key, initialValue) {
    const getStorageValue = (key, defaultValue) => {
        if (typeof window !== 'undefined') {
            const saved = localStorage.getItem(key);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch (error) {
                    console.error('Error parsing JSON from localStorage', error);
                    return defaultValue;
                }
            }
        }
        return defaultValue;
    }

    const [value, setValue] = useState(() => {
        return getStorageValue(key, initialValue);
    });

    useEffect(() => {
        localStorage.setItem(key, JSON.stringify(value));
    }, [key, value]);

    return [value, setValue];
}

// --- UTILS ---
const parseTasks = (csv) => {
    const lines = csv.trim().split('\n');
    const headers = lines.shift()?.split(',');
    if (!headers) return [];

    return lines.map(line => {
        const values = line.split(',');
        const taskData = headers.reduce((obj, header, index) => {
            obj[header] = values[index];
            return obj;
        }, {});

        const teamKey = Object.keys(teamMapping).find(key => taskData.Subject.startsWith(key));
        const teamInfo = teamKey ? teamMapping[teamKey] : { name: 'General', color: 'bg-gray-500', avatar: 'G', className: 'General', role: '' };

        return {
            subject: taskData.Subject,
            startDate: new Date(`${taskData['Start Date']}T${taskData['Start Time']}`),
            endDate: new Date(`${taskData['End Date']}T${taskData['End Time']}`),
            description: taskData.Description,
            location: taskData.Location,
            team: teamInfo.name,
            teamColor: teamInfo.color,
            teamAvatar: teamInfo.avatar,
            teamClass: teamInfo.className,
        };
    });
};

// --- SERVICES ---
const summarizeComments = async (comments) => {
    if (!process.env.API_KEY) {
        console.error("API_KEY environment variable not set.");
        return "API key is not configured. Please contact the administrator.";
    }

    try {
        const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
        const commentsText = comments.map(c => `- ${c.username} (${c.team}): "${c.text}"`).join('\n');
        
        if (commentsText.length === 0) {
            return "There are no comments to summarize.";
        }

        const prompt = `
            You are an assistant for a project management dashboard called DigiHive.
            Your task is to summarize the following team comments.
            Focus on key points, challenges, and action items.
            Provide the summary in a concise, easy-to-read format using bullet points.
            
            Comments:
            ${commentsText}
        `;

        const response = await ai.models.generateContent({
            model: 'gemini-2.5-flash',
            contents: prompt,
        });

        return response.text;
    } catch (error) {
        console.error("Error summarizing comments with Gemini API:", error);
        return "Failed to generate summary. The AI service may be temporarily unavailable.";
    }
};


// --- COMPONENTS ---

const Modal = ({ isOpen, onClose, children, size = 'md' }) => {
    useEffect(() => {
        const handleEsc = (event) => {
            if (event.key === 'Escape') {
                onClose();
            }
        };
        window.addEventListener('keydown', handleEsc);
        return () => {
            window.removeEventListener('keydown', handleEsc);
        };
    }, [onClose]);

    if (!isOpen) return null;

    const sizeClasses = {
        sm: 'max-w-sm',
        md: 'max-w-md',
        lg: 'max-w-2xl',
        xl: 'max-w-4xl',
    };

    return (
        React.createElement('div', { 
            className: "fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-fade-in",
            onClick: onClose 
        },
            React.createElement('div', { 
                className: `bg-white rounded-2xl shadow-xl w-full ${sizeClasses[size]} max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-scale-up`,
                onClick: (e) => e.stopPropagation() 
            },
                React.createElement('button', { 
                    className: "absolute top-4 right-6 text-gray-400 hover:text-gray-600 text-2xl",
                    onClick: onClose 
                },
                    React.createElement('i', { className: "fas fa-times" })
                ),
                children
            )
        )
    );
};

const CommentsSection = ({ comments, setComments, currentUser }) => {
    const [newComment, setNewComment] = useState('');
    const [isSummarizing, setIsSummarizing] = useState(false);
    const [summary, setSummary] = useState('');
    const [isSummaryModalOpen, setIsSummaryModalOpen] = useState(false);

    const handleSubmitComment = (e) => {
        e.preventDefault();
        if (newComment.trim() === '') return;

        const comment = {
            id: Date.now(),
            username: currentUser.username,
            team: currentUser.team,
            timestamp: new Date().toISOString(),
            text: newComment.trim(),
        };

        setComments([comment, ...comments]);
        setNewComment('');
    };

    const handleSummarize = async () => {
        setIsSummarizing(true);
        setSummary('');
        const result = await summarizeComments(comments);
        setSummary(result);
        setIsSummarizing(false);
        setIsSummaryModalOpen(true);
    };
    
    return (
        React.createElement('div', { className: "bg-white rounded-2xl p-6 shadow-sm h-full flex flex-col" },
            React.createElement('h3', { className: "text-xl font-bold text-slate-800 mb-4" }, "Team Comments"),
            React.createElement('form', { onSubmit: handleSubmitComment, className: "mb-4 flex gap-3" },
                React.createElement('input', {
                    type: "text",
                    value: newComment,
                    onChange: (e) => setNewComment(e.target.value),
                    placeholder: "Leave a comment about your tasks or challenges...",
                    className: "flex-grow w-full border-2 border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500"
                }),
                React.createElement('button', { type: "submit", className: "bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors" }, "Post")
            ),
            React.createElement('div', { className: "flex-1 overflow-y-auto pr-2 space-y-4" },
                comments.length === 0 ? (
                    React.createElement('div', { className: "text-center text-gray-400 pt-8" },
                        React.createElement('i', { className: "fas fa-comments text-4xl mb-2" }),
                        React.createElement('p', null, "No comments yet. Be the first to post!")
                    )
                ) : (
                    comments.map(comment => {
                         const commentTeamInfo = teamMapping[comment.team];
                         return (
                            React.createElement('div', { key: comment.id, className: "flex items-start gap-3" },
                                React.createElement('div', { className: `w-10 h-10 ${commentTeamInfo.color} rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` },
                                    comment.username.substring(0, 2).toUpperCase()
                                ),
                                React.createElement('div', { className: "flex-1 bg-gray-50 rounded-lg p-3" },
                                    React.createElement('div', { className: "flex justify-between items-baseline" },
                                        React.createElement('p', { className: "font-bold text-slate-700" }, 
                                            comment.username,
                                            React.createElement('span', { className: "font-normal text-sm text-gray-500 ml-1.5" }, `(${comment.team})`)
                                        ),
                                        React.createElement('p', { className: "text-xs text-gray-400" }, new Date(comment.timestamp).toLocaleString())
                                    ),
                                    React.createElement('p', { className: "text-sm text-gray-800 mt-1" }, comment.text)
                                )
                            )
                        )
                    })
                )
            ),
            React.createElement('button', {
                onClick: handleSummarize,
                disabled: isSummarizing || comments.length === 0,
                className: "w-full mt-4 bg-violet-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-violet-700 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            },
                isSummarizing ? (
                    React.createElement(React.Fragment, null,
                        React.createElement('i', { className: "fas fa-spinner fa-spin" }),
                        React.createElement('span', null, "Generating Summary...")
                    )
                ) : (
                    React.createElement(React.Fragment, null,
                       React.createElement('i', { className: "fas fa-wand-magic-sparkles" }),
                       React.createElement('span', null, "Summarize with AI")
                    )
                )
            ),
            React.createElement(Modal, { isOpen: isSummaryModalOpen, onClose: () => setIsSummaryModalOpen(false), size: "lg" },
                 React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-4" }, "AI-Generated Summary"),
                 React.createElement('div', { className: "prose prose-sm max-w-none whitespace-pre-wrap bg-gray-50 p-4 rounded-lg" },
                    summary.split('\n').map((line, i) => React.createElement('p', { key: i }, line))
                 ),
                 React.createElement('button', { onClick: () => setIsSummaryModalOpen(false), className: "mt-6 w-full bg-blue-500 text-white font-semibold px-6 py-2 rounded-lg" }, "Close")
            )
        )
    );
};

const Header = ({ user, onLogout, toggleSidebar, pageTitle }) => {
    return (
        React.createElement('header', { className: "flex justify-between items-center" },
            React.createElement('div', null,
                React.createElement('h1', { className: "text-2xl md:text-4xl font-bold text-[#1A1A2E]" },
                    pageTitles[pageTitle] || 'Dashboard'
                )
            ),
            React.createElement('div', { className: "flex items-center gap-4" },
                React.createElement('button', { onClick: toggleSidebar, className: "lg:hidden text-2xl text-gray-600" },
                    React.createElement('i', { className: "fas fa-bars" })
                ),
                React.createElement('div', { className: "flex items-center gap-3 bg-white p-2 rounded-full shadow-sm" },
                    React.createElement('div', { className: "w-10 h-10 rounded-full bg-[#2A5CAA] text-white flex items-center justify-center font-bold" },
                        user.username.substring(0, 2).toUpperCase()
                    ),
                    React.createElement('span', { className: "font-semibold text-sm hidden sm:block pr-2" }, user.username)
                ),
                 React.createElement('button', { onClick: onLogout, className: "text-gray-500 hover:text-red-500", title: "Logout" },
                    React.createElement('i', { className: "fas fa-sign-out-alt text-xl" })
                )
            )
        )
    );
};

const Sidebar = ({ currentPage, setCurrentPage, isSidebarOpen, setSidebarOpen }) => {
    
    const handleNavClick = (page) => {
        setCurrentPage(page);
        if (window.innerWidth < 1024) {
            setSidebarOpen(false);
        }
    };

    const navLinks = Object.keys(pageTitles).map(page => {
        const icons = {
            dashboard: 'fa-chart-line', tasks: 'fa-tasks', submissions: 'fa-file-archive', team: 'fa-users', settings: 'fa-cog'
        };
        const isActive = currentPage === page;
        if (!icons[page]) return null;
        return (
            React.createElement('li', { key: page },
              React.createElement('a', { href: "#", onClick: (e) => { e.preventDefault(); handleNavClick(page); }, className: `nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 text-slate-200 opacity-80 hover:bg-white/10 hover:opacity-100 ${isActive ? 'bg-[#2A5CAA] opacity-100 shadow-lg' : ''}` },
                React.createElement('i', { className: `w-5 text-center text-lg fas ${icons[page]}` }),
                React.createElement('span', null, pageTitles[page])
              )
            )
        );
    }).filter(Boolean);

    const teamMembers = Object.values(teamMapping).map(team => (
        React.createElement('li', { key: team.name, className: "flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/10 transition-colors duration-200" },
            React.createElement('div', { className: `w-9 h-9 ${team.color} rounded-md flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` }, team.avatar),
            React.createElement('div', { className: "flex-1" },
              React.createElement('p', { className: "text-sm font-semibold text-slate-200 leading-tight" }, team.name),
              React.createElement('p', { className: "text-xs text-slate-200 opacity-70 leading-tight" }, team.role)
            ),
            React.createElement('div', { className: "w-2.5 h-2.5 rounded-full bg-green-400 flex-shrink-0" })
        )
    ));

    return (
        React.createElement('aside', { className: `fixed top-0 left-0 h-full w-72 bg-[#1E293B] text-slate-200 p-6 z-40 transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0` },
            React.createElement('div', { className: "flex items-center gap-3 mb-12 px-2" },
                React.createElement('div', { className: "w-11 h-11 bg-gradient-to-br from-[#3A7BDA] to-[#673AB7] rounded-lg flex items-center justify-center text-white font-bold text-lg" }, "DH"),
                React.createElement('span', { className: "text-2xl font-extrabold text-slate-200" }, "DigiHive")
            ),
            React.createElement('nav', null, React.createElement('ul', { className: "space-y-2" }, navLinks)),
            React.createElement('div', { className: "mt-12" },
                React.createElement('h3', { className: "text-sm font-semibold text-slate-200 opacity-70 mb-4 px-2" }, "TEAMS"),
                React.createElement('ul', { className: "space-y-2" }, teamMembers)
            )
        )
    );
};

// --- PAGES ---
const LoginScreen = ({ users, setUsers, onLogin }) => {
    const [isLoginModalOpen, setLoginModalOpen] = useState(false);
    const [isRegisterModalOpen, setRegisterModalOpen] = useState(false);
    
    const [quote] = useState(MOTIVATION_QUOTES[Math.floor(Math.random() * MOTIVATION_QUOTES.length)]);

    const handleLogin = (e) => {
        e.preventDefault();
        const formData = new FormData(e.currentTarget);
        const username = formData.get('username');
        const password = formData.get('password');
        
        const user = users.find(u => u.username === username && u.password === password);
        if (user) {
            onLogin(user);
        } else {
            alert('Invalid username or password.');
        }
    };
    
    const handleRegister = (e) => {
        e.preventDefault();
        const formData = new FormData(e.currentTarget);
        if (formData.get('adminCode') !== ADMIN_CODE) {
            alert('Invalid Admin Code. Registration failed.');
            return;
        }

        const username = formData.get('username');
        const password = formData.get('password');
        const team = formData.get('team');
        
        if (users.find(u => u.username === username)) {
            alert('Username already exists.');
            return;
        }

        const newUser = { username, password, team, isOnline: false };
        setUsers([...users, newUser]);
        alert('Registration successful! Please log in.');
        setRegisterModalOpen(false);
        setLoginModalOpen(true);
    };

    const teamOptions = Object.values(teamMapping).map(t => React.createElement('option', { key: t.name, value: t.name }, t.name));

    return (
        React.createElement('div', { className: "fixed inset-0 bg-gray-900 bg-opacity-80 flex items-center justify-center z-50 p-4" },
            React.createElement('div', { className: "bg-white rounded-2xl shadow-2xl p-8 max-w-lg w-full text-center" },
                React.createElement('div', { className: "flex justify-center items-center gap-3 mb-4" },
                  React.createElement('div', { className: "w-11 h-11 bg-gradient-to-br from-[#3A7BDA] to-[#673AB7] rounded-lg flex items-center justify-center text-white font-bold text-lg" }, "DH"),
                  React.createElement('span', { className: "text-2xl font-extrabold text-slate-800" }, "Welcome to DigiHive")
                ),
                React.createElement('div', { className: "my-6 p-4 bg-gray-100 rounded-lg border-l-4 border-blue-500" },
                    React.createElement('p', { className: "text-gray-700 italic" }, `"${quote}"`)
                ),
                React.createElement('div', { className: "flex flex-col sm:flex-row gap-4" },
                    React.createElement('button', { onClick: () => setLoginModalOpen(true), className: "flex-1 bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300" }, "Login"),
                    React.createElement('button', { onClick: () => setRegisterModalOpen(true), className: "flex-1 bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-colors duration-300" }, "Register a Team Member")
                )
            ),
            React.createElement(Modal, { isOpen: isLoginModalOpen, onClose: () => setLoginModalOpen(false) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Login to DigiHive"),
                React.createElement('form', { onSubmit: handleLogin },
                    React.createElement('div', { className: "mb-4" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Username"),
                        React.createElement('input', { type: "text", name: "username", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500" })
                    ),
                    React.createElement('div', { className: "mb-6" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Password"),
                        React.createElement('input', { type: "password", name: "password", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500" })
                    ),
                    React.createElement('button', { type: "submit", className: "w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors" }, "Login")
                )
            ),
            React.createElement(Modal, { isOpen: isRegisterModalOpen, onClose: () => setRegisterModalOpen(false) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Register New Member"),
                React.createElement('form', { onSubmit: handleRegister },
                    React.createElement('div', { className: "mb-4" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Username"),
                        React.createElement('input', { type: "text", name: "username", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                    React.createElement('div', { className: "mb-4" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Password"),
                        React.createElement('input', { type: "password", name: "password", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                     React.createElement('div', { className: "mb-4" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Team"),
                        React.createElement('select', { name: "team", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2 bg-white" }, teamOptions)
                    ),
                     React.createElement('div', { className: "mb-6" },
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Admin Code"),
                        React.createElement('input', { type: "password", name: "adminCode", placeholder: "Required for registration", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                    React.createElement('button', { type: "submit", className: "w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition-colors" }, "Register")
                )
            )
        )

        e.preventDefault();
        const formData = new FormData(e.currentTarget);
        const updatedUser = {
            ...currentUser,
            notifications: {
                email: formData.get('email') === 'on',
                push: formData.get('push') === 'on'
            }
        };
        updateUser(updatedUser);
        alert('Notification preferences updated!');
        setActiveModal(null);
    };

    const createCard = (title, desc, btnText, icon, modalKey) => (
        React.createElement('div', { className: "bg-white rounded-2xl p-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4" },
            React.createElement('div', { className: "flex items-center gap-5" },
                React.createElement('div', { className: "w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl" }, React.createElement('i', { className: `fas ${icon}` })),
                React.createElement('div', null, React.createElement('h3', { className: "text-lg font-bold text-slate-800" }, title), React.createElement('p', { className: "text-gray-500 text-sm" }, desc))
            ),
            React.createElement('button', { onClick: () => setActiveModal(modalKey), className: "bg-blue-500 text-white font-semibold px-5 py-2 rounded-lg hover:bg-blue-600 w-full md:w-auto" }, btnText)
        )
    );

    return (
        React.createElement('div', { className: "space-y-6" },
            createCard('Profile Information', 'Update your personal information.', 'Edit Profile', 'fa-user-edit', 'profile'),
            createCard('Notification Preferences', 'Manage how you receive notifications.', 'Configure', 'fa-bell', 'notifications'),
            createCard('Security Settings', 'Update your password and security.', 'Update Security', 'fa-shield-alt', 'security'),
            createCard('Team Preferences', 'Customize how you interact with your team.', 'Manage', 'fa-users-cog', 'team'),
            React.createElement(Modal, { isOpen: activeModal === 'profile', onClose: () => setActiveModal(null) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Edit Profile"),
                React.createElement('p', { className: "text-center text-gray-500" }, "This feature is coming soon. For now, your username is ", React.createElement('strong', null, currentUser.username), " and you are on the ", React.createElement('strong', null, currentUser.team), " team.")
            ),
            React.createElement(Modal, { isOpen: activeModal === 'notifications', onClose: () => setActiveModal(null) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Notification Preferences"),
                React.createElement('form', { onSubmit: handleUpdateNotifications, className: "space-y-4" },
                    React.createElement('label', { className: "flex items-center justify-between p-4 bg-gray-50 rounded-lg" },
                        React.createElement('span', { className: "font-medium text-gray-700" }, "Email Notifications"),
                        React.createElement('input', { type: "checkbox", name: "email", defaultChecked: currentUser.notifications?.email, className: "h-6 w-6 rounded text-blue-600 focus:ring-blue-500" })
                    ),
                    React.createElement('label', { className: "flex items-center justify-between p-4 bg-gray-50 rounded-lg" },
                        React.createElement('span', { className: "font-medium text-gray-700" }, "Push Notifications"),
                        React.createElement('input', { type: "checkbox", name: "push", defaultChecked: currentUser.notifications?.push, className: "h-6 w-6 rounded text-blue-600 focus:ring-blue-500" })
                    ),
                    React.createElement('button', { type: "submit", className: "w-full mt-4 bg-green-500 text-white font-bold py-3 rounded-lg" }, "Save Preferences")
                )
            ),
            React.createElement(Modal, { isOpen: activeModal === 'security', onClose: () => setActiveModal(null) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Update Password"),
                React.createElement('form', { onSubmit: handleUpdatePassword, className: "space-y-4" },
                    React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Current Password"),
                        React.createElement('input', { type: "password", name: "currentPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                     React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "New Password"),
                        React.createElement('input', { type: "password", name: "newPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                     React.createElement('div', null,
                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-1" }, "Confirm New Password"),
                        React.createElement('input', { type: "password", name: "confirmPassword", required: true, className: "w-full border-2 border-gray-200 rounded-lg p-2" })
                    ),
                    React.createElement('button', { type: "submit", className: "w-full mt-4 bg-green-500 text-white font-bold py-3 rounded-lg" }, "Update Password")
                )
            ),
            React.createElement(Modal, { isOpen: activeModal === 'team', onClose: () => setActiveModal(null) },
                React.createElement('h2', { className: "text-2xl font-bold text-slate-800 mb-6 text-center" }, "Team Preferences"),
                 React.createElement('p', { className: "text-center text-gray-500" }, "Team preference settings will be available in a future update.")
            )
        )
    );
};

// --- APP ---
const App = () => {
    const [users, setUsers] = useLocalStorage('digihive_users', []);
    const [currentUser, setCurrentUser] = useLocalStorage('digihive_currentUser', null);
    const [currentPage, setCurrentPage] = useState('dashboard');
    const [isSidebarOpen, setSidebarOpen] = useState(false);

    const [allTasks, setAllTasks] = useState([]);
    const [submissions, setSubmissions] = useLocalStorage('digihive_submissions', []);
    const [comments, setComments] = useLocalStorage('digihive_comments', []);

    useEffect(() => {
        setAllTasks(parseTasks(CSV_DATA));
        
        const storedUsers = JSON.parse(localStorage.getItem('digihive_users') || '[]');
        const masterUsernames = MASTER_USERS.map(u => u.username);
        const hasMasterUsers = storedUsers.some(u => masterUsernames.includes(u.username));

        if (!hasMasterUsers) {
            const localOnlyUsers = storedUsers.filter(u => !masterUsernames.includes(u.username));
            setUsers([...MASTER_USERS, ...localOnlyUsers]);
        }
    }, [setUsers]);

    const updateUser = useCallback((updatedUser) => {
        setUsers(prevUsers => {
            const userExists = prevUsers.some(u => u.username === updatedUser.username);
            if (userExists) {
                return prevUsers.map(u => u.username === updatedUser.username ? updatedUser : u);
            }
            return [...prevUsers, updatedUser];
        });
    }, [setUsers]);
    
    const handleLogin = (user) => {
        const sessionToken = Date.now().toString() + Math.random().toString();
        const updatedUser = {
            ...user,
            sessionToken,
            isOnline: true,
            lastLogin: new Date().toISOString()
        };
        updateUser(updatedUser);
        setCurrentUser(updatedUser);
    };

    const handleLogout = useCallback(() => {
        if (currentUser) {
            const userToUpdate = users.find(u => u.username === currentUser.username);
            if(userToUpdate) {
                const updatedUser = {
                    ...userToUpdate,
                    isOnline: false,
                    lastLogout: new Date().toISOString(),
                    sessionToken: undefined
                };
                updateUser(updatedUser);
            }
        }
        setCurrentUser(null);
    }, [currentUser, users, setCurrentUser, updateUser]);

    useEffect(() => {
        const handleStorageChange = (event) => {
            if (!event.key || !event.newValue) return;

            const updateState = (setter) => {
                try {
                    setter(JSON.parse(event.newValue));
                } catch (e) {
                    console.error("Failed to parse storage update", e);
                }
            };

            switch (event.key) {
                case 'digihive_comments':
                    updateState(setComments);
                    break;
                case 'digihive_submissions':
                    updateState(setSubmissions);
                    break;
                case 'digihive_users':
                    updateState(setUsers);
                    break;
                case 'digihive_currentUser':
                    if (event.newValue === 'null') {
                       handleLogout();
                    }
                    break;
            }
        };

        window.addEventListener('storage', handleStorageChange);
        return () => window.removeEventListener('storage', handleStorageChange);
    }, [setComments, setSubmissions, setUsers, handleLogout]);

    useEffect(() => {
        const handleBeforeUnload = () => {
            if (currentUser) {
                const latestUsers = JSON.parse(localStorage.getItem('digihive_users') || '[]');
                const userIndex = latestUsers.findIndex(u => u.username === currentUser.username);
                if (userIndex !== -1) {
                    latestUsers[userIndex].isOnline = false;
                    latestUsers[userIndex].lastLogout = new Date().toISOString();
                    localStorage.setItem('digihive_users', JSON.stringify(latestUsers));
                }
            }
        };

        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
    }, [currentUser]);

    useEffect(() => {
        if (currentUser) {
            const userInDb = users.find(u => u.username === currentUser.username);
            if (!userInDb) {
                handleLogout();
                alert('Your user account could not be found. Please log in again.');
            } else if (!currentUser.isOnline) {
                const updatedUser = { ...currentUser, isOnline: true };
                updateUser(updatedUser);
                setCurrentUser(updatedUser);
            }
        }
    }, [currentUser, users, handleLogout, updateUser, setCurrentUser]);

    const renderPage = () => {
        switch (currentPage) {
            case 'dashboard':
                return React.createElement(Dashboard, { allTasks, comments, setComments, currentUser, submissions, setSubmissions });
            case 'tasks':
                return React.createElement(Tasks, { allTasks });
            case 'submissions':
                return React.createElement(Submissions, { submissions });
            case 'team':
                return React.createElement(Team, { users, setUsers, currentUser });
            case 'settings':
                return React.createElement(Settings, { currentUser, updateUser });
            default:
                return React.createElement('div', { className: "bg-white rounded-2xl p-6 shadow-sm" }, React.createElement('h2', { className: "text-2xl font-bold" }, currentPage), React.createElement('p', null, "Page not found."));
        }
    };

    if (!currentUser) {
        return React.createElement(LoginScreen, { users, setUsers, onLogin: handleLogin });
    }

    return (
        React.createElement('div', { className: "flex min-h-screen bg-[#F8FAFC] text-[#1A1A2E]" },
            React.createElement(Sidebar, { currentPage, setCurrentPage, isSidebarOpen, setSidebarOpen }),
             React.createElement('div', {
                className: `fixed inset-0 bg-black/50 z-30 lg:hidden ${isSidebarOpen ? 'block' : 'hidden'}`,
                onClick: () => setSidebarOpen(false)
            }),
            React.createElement('main', { className: "flex-1 transition-all duration-300 ease-in-out lg:ml-72 p-6 sm:p-8 md:p-12" },
                React.createElement(Header, { 
                    user: currentUser, 
                    onLogout: handleLogout, 
                    toggleSidebar: () => setSidebarOpen(!isSidebarOpen),
                    pageTitle: currentPage
                }),
                React.createElement('div', { className: "mt-10" },
                    renderPage()
                )
            )
        )
    );
};

// --- RENDER ---
const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  React.createElement(StrictMode, null,
    React.createElement(App, null)
  )
);

</script>

</body>
