<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiHive - Live Team Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scale-up { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse-sync {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }
        @keyframes slide-in-right { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .animate-scale-up { animation: scale-up 0.3s ease-out forwards; }
        .animate-pulse-sync { animation: pulse-sync 2s infinite; }
        .animate-slide-in-right { animation: slide-in-right 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script>
        // --- CONSTANTS ---
        const TEAM_MAPPING = {
            'Administrator': { name: 'Administrator', color: 'bg-red-500', avatar: 'AD', role: 'System Administration' },
            'Full-Stack': { name: 'Full-Stack', color: 'bg-blue-600', avatar: 'FS', role: 'Development Team' },
            'UI/UX': { name: 'UI/UX', color: 'bg-purple-600', avatar: 'UX', role: 'Design Team' },
            'Marketing': { name: 'Marketing', color: 'bg-green-500', avatar: 'MK', role: 'Marketing Team' },
            'Support': { name: 'Support', color: 'bg-teal-500', avatar: 'ST', role: 'Support Team' },
            'Content': { name: 'Content', color: 'bg-orange-500', avatar: 'CT', role: 'Content Team' },
        };
        const PAGE_TITLES = {
            dashboard: 'Dashboard',
            tasks: 'My Tasks - Full List',
            submissions: 'Past Submissions Archive',
            team: 'Team Directory',
            settings: 'Settings'
        };
        const PAGE_ICONS = {
            dashboard: 'fa-chart-line',
            tasks: 'fa-tasks',
            submissions: 'fa-file-archive',
            team: 'fa-users',
            settings: 'fa-cog'
        };

        // --- REAL BACKEND SERVICE WITH LIVE DATA ---
        class BackendService {
            constructor() {
                this.baseURL = '/.netlify/functions';
                this.listeners = new Map();
                this.pollingIntervals = new Map();
                this.currentUser = null;
            }

            setCurrentUser(user) {
                this.currentUser = user;
            }

            async getUsers() {
                try {
                    const response = await fetch(`${this.baseURL}/users`);
                    if (!response.ok) throw new Error('Failed to fetch users');
                    return await response.json();
                } catch (error) {
                    console.error('Error fetching users:', error);
                    return [];
                }
            }

            async updateUser(username, updates) {
                try {
                    const response = await fetch(`${this.baseURL}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, updates, action: 'update' })
                    });
                    if (!response.ok) throw new Error('Failed to update user');
                    return await response.json();
                } catch (error) {
                    console.error('Error updating user:', error);
                    throw error;
                }
            }

            async getComments() {
                try {
                    const response = await fetch(`${this.baseURL}/comments`);
                    if (!response.ok) throw new Error('Failed to fetch comments');
                    const comments = await response.json();
                    // Return ALL comments - no filtering by team
                    return comments;
                } catch (error) {
                    console.error('Error fetching comments:', error);
                    return [];
                }
            }

            async addComment(comment) {
                try {
                    const response = await fetch(`${this.baseURL}/comments`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(comment)
                    });
                    if (!response.ok) throw new Error('Failed to add comment');
                    const result = await response.json();
                    // Notify all subscribers about the new data
                    this.notifyListeners('comments', await this.getComments());
                    return result;
                } catch (error) {
                    console.error('Error adding comment:', error);
                    throw error;
                }
            }

            async getSubmissions() {
                try {
                    const response = await fetch(`${this.baseURL}/submissions`);
                    if (!response.ok) throw new Error('Failed to fetch submissions');
                    const submissions = await response.json();
                    // Return ALL submissions - no filtering by team
                    return submissions;
                } catch (error) {
                    console.error('Error fetching submissions:', error);
                    return [];
                }
            }

            async addSubmission(submission) {
                try {
                    const response = await fetch(`${this.baseURL}/submissions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(submission)
                    });
                    if (!response.ok) throw new Error('Failed to add submission');
                    const result = await response.json();
                    this.notifyListeners('submissions', await this.getSubmissions());
                    return result;
                } catch (error) {
                    console.error('Error adding submission:', error);
                    throw error;
                }
            }

            async getTasks() {
                try {
                    const response = await fetch(`${this.baseURL}/tasks`);
                    if (!response.ok) throw new Error('Failed to fetch tasks');
                    const tasks = await response.json();
                    // Return ALL tasks - no filtering by team
                    return tasks;
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                    return [];
                }
            }

            subscribe(key, callback) {
                if (!this.listeners.has(key)) this.listeners.set(key, new Set());
                this.listeners.get(key).add(callback);
                
                // Set up polling for real-time updates (every 2 seconds)
                if (!this.pollingIntervals.has(key)) {
                    const interval = setInterval(async () => {
                        try {
                            const data = await this[`get${key.charAt(0).toUpperCase() + key.slice(1)}`]();
                            this.notifyListeners(key, data);
                        } catch (error) {
                            console.error(`Error polling ${key}:`, error);
                        }
                    }, 2000);
                    
                    this.pollingIntervals.set(key, interval);
                }
                
                return () => {
                    this.listeners.get(key)?.delete(callback);
                    if (this.listeners.get(key)?.size === 0) {
                        const interval = this.pollingIntervals.get(key);
                        if (interval) {
                            clearInterval(interval);
                            this.pollingIntervals.delete(key);
                        }
                    }
                };
            }

            notifyListeners(key, data) { 
                if (this.listeners.has(key)) {
                    this.listeners.get(key).forEach(callback => {
                        try {
                            callback(data);
                        } catch (error) {
                            console.error('Error in listener:', error);
                        }
                    });
                }
            }
        }

        const backendService = new BackendService();

        // --- UTILITIES ---
        function createElement(tag, props, ...children) {
            const element = document.createElement(tag);
            if (props) {
                Object.keys(props).forEach(key => {
                    if (key.startsWith('on') && typeof props[key] === 'function') {
                        element.addEventListener(key.substring(2).toLowerCase(), props[key]);
                    } else if (key === 'class') {
                        element.className = props[key];
                    } else {
                        element.setAttribute(key, props[key]);
                    }
                });
            }
            children.forEach(child => {
                if (typeof child === 'string' || typeof child === 'number') {
                    element.appendChild(document.createTextNode(child));
                } else if (child) {
                    element.appendChild(child);
                }
            });
            return element;
        }

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, children, size = 'md' }) => {
            if (!isOpen) return null;
            
            const sizeClasses = { 
                sm: 'max-w-sm', 
                md: 'max-w-md', 
                lg: 'max-w-2xl', 
                xl: 'max-w-4xl' 
            };
            
            const modalContainer = createElement('div', { 
                class: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-fade-in' 
            });
            
            const modalContent = createElement('div', { 
                class: `bg-white rounded-2xl shadow-xl w-full ${sizeClasses[size]} max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-scale-up` 
            });
            
            const closeButton = createElement('button', { 
                class: 'absolute top-4 right-6 text-gray-400 hover:text-gray-600 text-2xl transition-colors', 
                onclick: onClose 
            }, '×');
            
            modalContent.appendChild(closeButton);
            
            if (Array.isArray(children)) {
                children.forEach(child => {
                    if (child) modalContent.appendChild(child);
                });
            } else if (children) {
                modalContent.appendChild(children);
            }
            
            modalContainer.appendChild(modalContent);
            modalContainer.onclick = (e) => { 
                if (e.target === modalContainer) onClose(); 
            };
            
            document.body.appendChild(modalContainer);
            return modalContainer;
        }

        const SyncStatusIndicator = ({ isSyncing, lastSyncTime }) => {
            return createElement('div', { 
                class: `fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-2 rounded-lg shadow-lg transition-all duration-300 ${
                    isSyncing ? 'bg-blue-500 text-white animate-pulse-sync' : 'bg-green-500 text-white'
                } animate-slide-in-right` 
            },
                createElement('i', { 
                    class: `fas ${isSyncing ? 'fa-sync-alt fa-spin' : 'fa-check-circle'} mr-1` 
                }),
                createElement('span', { class: 'text-sm font-medium' }, 
                    isSyncing ? 'Syncing...' : `Live - ${lastSyncTime}`
                )
            );
        }

        const TeamPresenceHeader = ({ users = [] }) => {
            const onlineUsers = users.filter(u => u.isOnline);
            const onlineTeamsCount = new Set(onlineUsers.map(u => u.team)).size;
            
            return createElement('div', { class: 'bg-white rounded-2xl p-4 shadow-sm mb-6' },
                createElement('div', { class: 'flex items-center justify-between flex-wrap gap-4' },
                    createElement('div', { class: 'flex items-center gap-3' },
                        createElement('div', { class: 'flex items-center gap-2' },
                            createElement('div', { class: 'w-3 h-3 rounded-full bg-green-500 animate-pulse' }),
                            createElement('span', { class: 'font-bold text-slate-800' }, 'Live Team Status')
                        ),
                        createElement('span', { class: 'text-sm text-gray-600' }, 
                            `${onlineUsers.length} users online • ${onlineTeamsCount} of ${Object.keys(TEAM_MAPPING).length} teams active`
                        )
                    ),
                    createElement('div', { class: 'flex items-center gap-2 flex-wrap' },
                        ...Object.values(TEAM_MAPPING).map(team => {
                            const isOnline = users.some(u => u.team === team.name && u.isOnline);
                            return createElement('div', { 
                                class: 'flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-50',
                                title: team.name
                            },
                                createElement('div', { 
                                    class: `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-green-500' : 'bg-gray-400'}` 
                                }),
                                createElement('span', { class: 'text-sm font-medium text-slate-700' }, team.avatar)
                            );
                        })
                    )
                )
            );
        }

        const CommentsSection = ({ currentUser }) => {
            const container = createElement('div', { 
                class: 'bg-white rounded-2xl p-6 shadow-sm h-full flex flex-col' 
            });
            
            let comments = [];
            let newComment = '';

            const updateUI = () => {
                container.innerHTML = '';
                
                container.appendChild(
                    createElement('div', { class: 'flex items-center justify-between mb-4' },
                        createElement('h3', { class: 'text-xl font-bold text-slate-800' }, 'Team Comments'),
                        createElement('div', { class: 'flex items-center gap-2 text-sm text-green-600 bg-green-50 px-2 py-1 rounded-md' },
                            createElement('i', { class: 'fas fa-sync-alt mr-1' }),
                            createElement('span', null, 'Live Updates - All Teams')
                        )
                    )
                );
                
                const form = createElement('form', { 
                    class: 'mb-4 flex gap-3 flex-col sm:flex-row', 
                    onsubmit: handleSubmit 
                },
                    createElement('input', { 
                        type: 'text', 
                        class: 'flex-grow w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition', 
                        placeholder: 'Leave a comment about your tasks or challenges...', 
                        value: newComment, 
                        oninput: (e) => { newComment = e.target.value; } 
                    }),
                    createElement('button', { 
                        type: 'submit', 
                        class: 'bg-blue-600 text-white font-bold py-3 px-5 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2' 
                    },
                        createElement('i', { class: 'fas fa-paper-plane' }),
                        'Post'
                    )
                );
                
                container.appendChild(form);
                container.appendChild(renderCommentsList());
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (newComment.trim() === '') return;
                
                try {
                    await backendService.addComment({ 
                        username: currentUser.username, 
                        team: currentUser.team, 
                        text: newComment.trim() 
                    });
                    
                    newComment = '';
                    // UI will update automatically via subscription
                } catch (error) {
                    alert('Failed to post comment. Please try again.');
                }
            };
            
            const renderCommentsList = () => {
                const commentsList = createElement('div', { 
                    class: 'flex-1 overflow-y-auto pr-2 space-y-4 max-h-96' 
                });
                
                if (comments.length === 0) {
                    commentsList.appendChild(
                        createElement('div', { class: 'text-center text-gray-400 py-8 flex flex-col items-center' },
                            createElement('i', { class: 'fas fa-comments text-4xl mb-2' }),
                            createElement('p', null, 'No comments yet. Be the first to post!')
                        )
                    );
                } else {
                    comments.forEach(comment => {
                        const teamInfo = TEAM_MAPPING[comment.team];
                        commentsList.appendChild(
                            createElement('div', { class: 'flex items-start gap-3 animate-fade-in' },
                                createElement('div', { 
                                    class: `w-10 h-10 ${teamInfo.color} rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` 
                                }, comment.username.substring(0, 2).toUpperCase()),
                                createElement('div', { class: 'flex-1 bg-gray-50 rounded-lg p-3' },
                                    createElement('div', { class: 'flex justify-between items-baseline' },
                                        createElement('p', { class: 'font-bold text-slate-700' }, 
                                            comment.username,
                                            createElement('span', { class: 'font-normal text-sm text-gray-500 ml-1.5' }, `(${comment.team})`)
                                        ),
                                        createElement('p', { class: 'text-xs text-gray-400' }, 
                                            new Date(comment.timestamp).toLocaleString()
                                        )
                                    ),
                                    createElement('p', { class: 'text-sm text-gray-800 mt-1 break-words' }, comment.text)
                                )
                            )
                        );
                    });
                }
                return commentsList;
            };

            // Subscribe to comments updates
            const unsubscribe = backendService.subscribe('comments', (data) => {
                comments = data;
                updateUI();
            });
            
            // Initial load
            backendService.getComments().then(data => {
                comments = data;
                updateUI();
            });
            
            return container;
        }

        const DashboardPage = ({ currentUser, triggerSync }) => {
            const container = createElement('div', { class: 'space-y-8' });
            
            let users = [];
            let comments = [];
            let submissions = [];
            let tasks = [];
            let isModalOpen = false;
            let submissionSuccess = false;

            const updateUI = () => {
                container.innerHTML = '';
                
                const upcomingTasks = tasks.filter(task => new Date(task.startDate) > new Date()).length;
                const onlineNow = users.filter(u => u.isOnline).length;
                
                const stats = [
                    { icon: 'fa-list-check', value: upcomingTasks, label: 'Upcoming Tasks', color: 'bg-blue-500' },
                    { icon: 'fa-check-double', value: submissions.length, label: 'Total Submissions', color: 'bg-violet-500' },
                    { icon: 'fa-comments', value: comments.length, label: 'Team Comments', color: 'bg-teal-500' },
                    { icon: 'fa-users', value: onlineNow, label: 'Online Now', color: 'bg-amber-500' },
                ];
                
                container.appendChild(TeamPresenceHeader({ users }));
                
                container.appendChild(
                    createElement('div', { class: 'p-4 rounded-lg border-l-4 border-blue-500 bg-blue-50 text-blue-800 mb-6' },
                        createElement('i', { class: 'fas fa-sync-alt mr-2' }), 
                        ' All data is synchronized in real-time across all users and browsers'
                    )
                );
                
                container.appendChild(
                    createElement('div', { class: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6' },
                        ...stats.map(stat => 
                            createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm' },
                                createElement('div', { 
                                    class: `w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl ${stat.color}` 
                                }, createElement('i', { class: `fas ${stat.icon}` })),
                                createElement('div', { class: 'mt-4' },
                                    createElement('p', { class: 'text-4xl font-bold text-slate-800' }, stat.value),
                                    createElement('p', { class: 'text-md text-gray-500 font-medium' }, stat.label)
                                )
                            )
                        )
                    )
                );
                
                container.appendChild(
                    createElement('div', { class: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                        createElement('div', { class: 'lg:col-span-2' }, 
                            CommentsSection({ currentUser })
                        ),
                        createElement('div', { class: 'lg:col-span-1 space-y-8' },
                            createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm' },
                                createElement('h3', { class: 'text-xl font-bold text-slate-800 mb-4' }, 'Live Team Activity'),
                                createElement('div', { class: 'space-y-3' },
                                    createElement('div', { class: 'flex items-center justify-between p-3 bg-green-50 rounded-lg' },
                                        createElement('div', { class: 'flex items-center gap-3' },
                                            createElement('i', { class: 'fas fa-sync-alt text-green-600' }),
                                            createElement('span', { class: 'font-semibold text-sm text-green-800' }, 'Real-Time Sync')
                                        ),
                                        createElement('span', { class: 'font-bold text-sm text-green-600' }, 'Active')
                                    ),
                                    createElement('div', { class: 'text-sm text-gray-600' },
                                        createElement('p', { class: 'font-semibold mb-2' }, 'Recent Activity:'),
                                        ...comments.slice(0, 3).map(comment => 
                                            createElement('p', { class: 'truncate text-xs mb-1' },
                                                `${comment.username} (${comment.team}): ${comment.text}`
                                            )
                                        )
                                    )
                                )
                            ),
                            createElement('div', { 
                                class: 'bg-white rounded-2xl p-6 shadow-sm cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-300',
                                onclick: openModal
                            },
                                createElement('div', { class: 'flex flex-col items-center text-center gap-4' },
                                    createElement('div', { 
                                        class: 'w-16 h-16 rounded-full bg-blue-100 text-blue-500 text-3xl flex items-center justify-center' 
                                    }, createElement('i', { class: 'fas fa-cloud-upload-alt' })),
                                    createElement('div', null, 
                                        createElement('h3', { class: 'font-bold text-slate-800 text-lg' }, 'Submit Weekly Report'), 
                                        createElement('p', { class: 'text-sm text-gray-500 mt-1' }, 'Share progress with the team')
                                    )
                                )
                            )
                        )
                    )
                );
                
                renderModal();
            };
            
            const handleSubmitReport = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                try {
                    await backendService.addSubmission({ 
                        name: formData.get('title'), 
                        member: currentUser.username, 
                        team: formData.get('targetTeam') || currentUser.team, 
                        progress: formData.get('progress'), 
                        plan: formData.get('plan'), 
                        fileType: 'Report'
                    });
                    
                    triggerSync();
                    submissionSuccess = true;
                    updateUI();
                } catch (error) {
                    alert('Failed to submit report. Please try again.');
                }
            };

            const openModal = () => { 
                submissionSuccess = false; 
                isModalOpen = true; 
                updateUI(); 
            };
            
            const closeModal = () => { 
                isModalOpen = false; 
                updateUI(); 
            };
            
            const renderModal = () => {
                if (!isModalOpen) return;
                
                Modal({
                    isOpen: isModalOpen, 
                    onClose: closeModal, 
                    size: 'lg',
                    children: submissionSuccess ?
                        createElement('div', { class: 'text-center py-10' },
                            createElement('i', { class: 'fas fa-check-circle text-6xl text-green-500 mb-4' }),
                            createElement('h2', { class: 'text-2xl font-bold text-slate-800' }, 'Submission Successful!'),
                            createElement('p', { class: 'text-gray-600 mt-2' }, 'Your report has been shared with all team members in real-time.'),
                            createElement('button', { 
                                class: 'mt-6 bg-blue-500 text-white font-semibold px-6 py-2 rounded-lg',
                                onclick: closeModal
                            }, 'Close')
                        ) :
                        createElement('div', null,
                            createElement('h2', { class: 'text-2xl font-bold text-slate-800 mb-6' }, 'Weekly Report Submission'),
                            createElement('form', { class: 'space-y-4', onsubmit: handleSubmitReport },
                                createElement('div', null, 
                                    createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Report Title'), 
                                    createElement('input', { 
                                        type: 'text', 
                                        name: 'title', 
                                        placeholder: 'e.g., Q1 Week 4 Progress Report', 
                                        required: true, 
                                        class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                                    })
                                ),
                                createElement('div', null, 
                                    createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Target Team'), 
                                    createElement('select', { 
                                        name: 'targetTeam', 
                                        class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                                    },
                                        ...Object.values(TEAM_MAPPING).map(team => 
                                            createElement('option', { value: team.name }, team.name)
                                        )
                                    )
                                ),
                                createElement('div', null, 
                                    createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, 'Progress Report'), 
                                    createElement('textarea', { 
                                        name: 'progress', 
                                        placeholder: 'Describe your progress...', 
                                        required: true, 
                                        rows: 4, 
                                        class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                                    })
                                ),
                                createElement('div', null, 
                                    createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1' }, "Next Week's Plan"), 
                                    createElement('textarea', { 
                                        name: 'plan', 
                                        placeholder: 'Outline your plans...', 
                                        required: true, 
                                        rows: 3, 
                                        class: 'w-full border-2 border-gray-200 rounded-lg p-2' 
                                    })
                                ),
                                createElement('button', { 
                                    type: 'submit', 
                                    class: 'w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2' 
                                }, 
                                    createElement('i', { class: 'fas fa-paper-plane' }),
                                    'Submit Report to Team'
                                )
                            )
                        )
                });
            };

            // Subscribe to data updates
            const unsubscribers = [
                backendService.subscribe('users', (data) => {
                    users = data;
                    updateUI();
                }),
                backendService.subscribe('comments', (data) => {
                    comments = data;
                    updateUI();
                }),
                backendService.subscribe('submissions', (data) => {
                    submissions = data;
                    updateUI();
                }),
                backendService.subscribe('tasks', (data) => {
                    tasks = data;
                    updateUI();
                })
            ];
            
            // Initial data load
            Promise.all([
                backendService.getUsers(),
                backendService.getComments(),
                backendService.getSubmissions(),
                backendService.getTasks()
            ]).then(([userData, commentData, submissionData, taskData]) => {
                users = userData;
                comments = commentData;
                submissions = submissionData;
                tasks = taskData;
                updateUI();
            });
            
            return container;
        }

        // --- MAIN APP ---
        function App() {
            const root = document.getElementById('root');
            
            // App state
            let currentUser = JSON.parse(localStorage.getItem('digihive_currentUser') || 'null');
            let currentPage = 'dashboard';
            let isSyncing = false;
            let lastSyncTime = 'just now';
            let isSidebarOpen = window.innerWidth >= 1024;
            
            const handleLogin = (user) => {
                currentUser = user;
                backendService.setCurrentUser(user);
                localStorage.setItem('digihive_currentUser', JSON.stringify(user));
                
                // Update user online status
                backendService.updateUser(user.username, { 
                    isOnline: true,
                    lastLogin: new Date().toISOString()
                });
                
                updateUI();
            };
            
            const handleLogout = async () => {
                if (currentUser) {
                    await backendService.updateUser(currentUser.username, { 
                        isOnline: false, 
                        lastLogout: new Date().toISOString() 
                    });
                }
                currentUser = null;
                backendService.setCurrentUser(null);
                localStorage.removeItem('digihive_currentUser');
                updateUI();
            };
            
            const triggerSync = () => {
                isSyncing = true;
                updateUI();
                setTimeout(() => {
                    isSyncing = false;
                    lastSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    updateUI();
                }, 1000);
            };
            
            const renderPage = () => {
                if (!currentUser) return null;
                
                switch (currentPage) {
                    case 'dashboard': 
                        return DashboardPage({ currentUser, triggerSync });
                    case 'tasks': 
                        return createElement('div', { class: 'text-center p-8' }, 'Tasks page coming soon...');
                    case 'submissions': 
                        return createElement('div', { class: 'text-center p-8' }, 'Submissions page coming soon...');
                    case 'team': 
                        return createElement('div', { class: 'text-center p-8' }, 'Team page coming soon...');
                    case 'settings': 
                        return createElement('div', { class: 'text-center p-8' }, 'Settings page coming soon...');
                    default: 
                        return DashboardPage({ currentUser, triggerSync });
                }
            };
            
            function updateUI() {
                root.innerHTML = '';
                
                if (!currentUser) {
                    root.appendChild(LoginScreen({ onLogin: handleLogin }));
                    return;
                }
                
                // Add sync indicator
                root.appendChild(SyncStatusIndicator({ isSyncing, lastSyncTime }));
                
                const layout = createElement('div', { class: 'flex min-h-screen bg-slate-50' });
                
                // Sidebar
                const sidebar = createElement('aside', { 
                    class: `fixed top-0 left-0 h-full w-72 bg-slate-800 text-slate-200 p-6 z-40 transform transition-transform duration-300 ease-in-out ${
                        isSidebarOpen ? 'translate-x-0' : '-translate-x-full'
                    } lg:translate-x-0 overflow-y-auto` 
                });
                
                sidebar.appendChild(
                    createElement('div', { class: 'flex items-center gap-3 mb-12 px-2' },
                        createElement('div', { 
                            class: 'w-11 h-11 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg' 
                        }, 'DH'),
                        createElement('span', { class: 'text-2xl font-extrabold text-slate-200' }, 'DigiHive')
                    )
                );
                
                const navLinks = Object.keys(PAGE_TITLES).map(page => 
                    createElement('li', null,
                        createElement('a', { 
                            href: '#', 
                            class: `flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 hover:bg-white/10 ${
                                currentPage === page ? 'bg-blue-600 shadow-lg text-white' : 'text-slate-300'
                            }`, 
                            onclick: (e) => {
                                e.preventDefault();
                                currentPage = page;
                                if (window.innerWidth < 1024) isSidebarOpen = false;
                                updateUI();
                            } 
                        },
                            createElement('i', { class: `w-5 text-center text-lg fas ${PAGE_ICONS[page]}` }),
                            createElement('span', null, PAGE_TITLES[page])
                        )
                    )
                );
                
                sidebar.appendChild(
                    createElement('nav', null, 
                        createElement('ul', { class: 'space-y-2' }, ...navLinks)
                    )
                );
                
                layout.appendChild(sidebar);
                
                // Overlay for mobile sidebar
                if (isSidebarOpen && window.innerWidth < 1024) {
                    layout.appendChild(
                        createElement('div', { 
                            class: 'fixed inset-0 bg-black/50 z-30 lg:hidden', 
                            onclick: () => { 
                                isSidebarOpen = false; 
                                updateUI(); 
                            } 
                        })
                    );
                }
                
                // Main content area
                const main = createElement('main', { 
                    class: `flex-1 transition-all duration-300 ease-in-out ${
                        window.innerWidth >= 1024 ? 'lg:ml-72' : ''
                    } p-6 sm:p-8 md:p-12` 
                });
                
                const header = createElement('header', { class: 'flex justify-between items-center flex-wrap gap-4' },
                    createElement('h1', { class: 'text-2xl md:text-4xl font-bold text-slate-800' }, 
                        PAGE_TITLES[currentPage] || 'Dashboard'
                    ),
                    createElement('div', { class: 'flex items-center gap-4' },
                        createElement('button', { 
                            class: 'lg:hidden text-2xl text-gray-600', 
                            onclick: () => { 
                                isSidebarOpen = !isSidebarOpen; 
                                updateUI(); 
                            } 
                        }, createElement('i', { class: 'fas fa-bars' })),
                        createElement('button', { 
                            class: 'bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg flex items-center gap-2',
                            onclick: triggerSync
                        },
                            createElement('i', { class: 'fas fa-sync-alt' }),
                            'Sync Now'
                        ),
                        createElement('div', { class: 'flex items-center gap-3 bg-white p-2 rounded-full shadow-sm' },
                            createElement('div', { 
                                class: `w-10 h-10 rounded-full ${TEAM_MAPPING[currentUser.team].color} text-white flex items-center justify-center font-bold` 
                            }, currentUser.username.substring(0, 2).toUpperCase()),
                            createElement('span', { class: 'font-semibold text-sm hidden sm:block pr-2' }, currentUser.username)
                        ),
                        createElement('button', { 
                            title: 'Logout', 
                            class: 'text-gray-500 hover:text-red-500 text-2xl transition', 
                            onclick: handleLogout 
                        }, createElement('i', { class: 'fas fa-sign-out-alt' }))
                    )
                );
                
                const mainContentContainer = createElement('div', { class: 'mt-10' });
                const pageElement = renderPage();
                if (pageElement) mainContentContainer.appendChild(pageElement);
                
                main.appendChild(header);
                main.appendChild(mainContentContainer);
                layout.appendChild(main);
                
                root.appendChild(layout);
            }
            
            // Handle window resize
            window.addEventListener('resize', () => {
                const shouldBeOpen = window.innerWidth >= 1024;
                if (isSidebarOpen !== shouldBeOpen) {
                    isSidebarOpen = shouldBeOpen;
                    updateUI();
                }
            });
            
            // Update user online status on load
            if (currentUser) {
                backendService.setCurrentUser(currentUser);
                backendService.updateUser(currentUser.username, { 
                    isOnline: true,
                    lastLogin: new Date().toISOString()
                });
            }
            
            // Initial render
            updateUI();
        }

        // Login Screen Component
        function LoginScreen({ onLogin }) {
            const container = createElement('div', { 
                class: 'min-h-screen bg-slate-100 flex items-center justify-center p-4 animate-fade-in' 
            });
            
            let users = [];
            let error = '';

            const handleSubmit = async (e) => {
                e.preventDefault();
                error = '';
                const formData = new FormData(e.target);
                const username = formData.get('username');
                const password = formData.get('password');
                
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    onLogin(user);
                } else {
                    error = 'Invalid username or password.';
                    updateUI();
                }
            };

            const updateUI = () => {
                container.innerHTML = '';
                
                container.appendChild(
                    createElement('div', { 
                        class: 'bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center animate-scale-up' 
                    },
                        createElement('div', { class: 'flex justify-center items-center gap-3 mb-4' },
                            createElement('div', { 
                                class: 'w-11 h-11 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg' 
                            }, 'DH'),
                            createElement('span', { class: 'text-2xl font-extrabold text-slate-800' }, 'DigiHive')
                        ),
                        createElement('div', { class: 'my-6 p-4 bg-blue-50 rounded-lg border-l-4 border-blue-500' },
                            createElement('p', { class: 'text-blue-700 font-medium' }, 
                                'Real-time collaborative dashboard with shared data across all teams'
                            )
                        ),
                        createElement('form', { class: 'space-y-4', onsubmit: handleSubmit },
                            error && createElement('p', { class: 'text-red-500 text-sm bg-red-50 p-2 rounded' }, error),
                            createElement('div', null, 
                                createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1 text-left' }, 'Username'), 
                                createElement('input', { 
                                    type: 'text', 
                                    name: 'username', 
                                    required: true, 
                                    class: 'w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500', 
                                    placeholder: 'Enter your username' 
                                })
                            ),
                            createElement('div', null, 
                                createElement('label', { class: 'block text-sm font-medium text-gray-700 mb-1 text-left' }, 'Password'), 
                                createElement('input', { 
                                    type: 'password', 
                                    name: 'password', 
                                    required: true, 
                                    class: 'w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500', 
                                    placeholder: 'Enter your password' 
                                })
                            ),
                            createElement('button', { 
                                type: 'submit', 
                                class: 'w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors text-lg' 
                            }, 'Login to Dashboard')
                        ),
                        createElement('div', { class: 'mt-4 text-sm text-gray-600' },
                            'Demo accounts: admin/password, dev/password, designer/password'
                        )
                    )
                );
            };
            
            // Load users and initial UI
            backendService.getUsers().then(data => {
                users = data;
                updateUI();
            });
            
            return container;
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', App);
    </script>
</body>
</html>
