
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiHive - Live Team Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scale-up { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse-sync {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }
        @keyframes slide-in-right { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .animate-scale-up { animation: scale-up 0.3s ease-out forwards; }
        .animate-pulse-sync { animation: pulse-sync 2s infinite; }
        .animate-slide-in-right { animation: slide-in-right 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script>
        // --- CONSTANTS ---
        const TEAM_MAPPING = {
            'Administrator': { name: 'Administrator', color: 'bg-red-500', avatar: 'AD', role: 'System Administration' },
            'Full-Stack': { name: 'Full-Stack', color: 'bg-blue-600', avatar: 'FS', role: 'Development Team' },
            'UI/UX': { name: 'UI/UX', color: 'bg-purple-600', avatar: 'UX', role: 'Design Team' },
            'Marketing': { name: 'Marketing', color: 'bg-green-500', avatar: 'MK', role: 'Marketing Team' },
            'Support': { name: 'Support', color: 'bg-teal-500', avatar: 'ST', role: 'Support Team' },
            'Content': { name: 'Content', color: 'bg-orange-500', avatar: 'CT', role: 'Content Team' },
        };
        const PAGE_TITLES = {
            dashboard: 'Dashboard',
            tasks: 'My Tasks - Full List',
            submissions: 'Past Submissions Archive',
            team: 'Team Directory',
            settings: 'Settings'
        };
        const PAGE_ICONS = {
            dashboard: 'fa-chart-line',
            tasks: 'fa-tasks',
            submissions: 'fa-file-archive',
            team: 'fa-users',
            settings: 'fa-cog'
        };

        // --- DATABASE SERVICE ---
        class LiveDatabase {
            constructor() {
                this.listeners = new Map();
                this.initializeData();
                this.setupStorageSync();
            }

            initializeData() {
                if (!localStorage.getItem('digihive_users')) {
                    const initialUsers = [
                        { username: 'admin', password: 'password', team: 'Administrator', isOnline: false, lastLogin: null, lastLogout: null },
                        { username: 'dev', password: 'password', team: 'Full-Stack', isOnline: false, lastLogin: null, lastLogout: null },
                        { username: 'designer', password: 'password', team: 'UI/UX', isOnline: false, lastLogin: null, lastLogout: null },
                    ];
                    localStorage.setItem('digihive_users', JSON.stringify(initialUsers));
                }
                if (!localStorage.getItem('digihive_comments')) localStorage.setItem('digihive_comments', '[]');
                if (!localStorage.getItem('digihive_submissions')) localStorage.setItem('digihive_submissions', '[]');
                if (!localStorage.getItem('digihive_tasks')) {
                     const initialTasks = [
                        { id: 1, subject: "Full-stack Week 1 Server Infrastructure", startDate: "2026-01-13T09:00:00.000Z", endDate: "2026-01-13T11:00:00.000Z", description: "Set up cloud server environment. Configure database architecture. Implement basic security protocols. Create deployment pipeline.", team: "Full-Stack", status: "pending" },
                        { id: 2, subject: "Full-stack Week 1 Database Setup", startDate: "2026-01-14T09:00:00.000Z", endDate: "2026-01-14T11:00:00.000Z", description: "Design database schemas. Set up user tables and relationships. Implement data migration scripts. Create backup systems.", team: "Full-Stack", status: "pending" },
                        { id: 3, subject: "UI/UX Week 1 Design System", startDate: "2026-01-13T11:00:00.000Z", endDate: "2026-01-13T13:00:00.000Z", description: "Create brand color palette. Design typography system. Build component library. Establish design principles.", team: "UI/UX", status: "pending" },
                        { id: 4, subject: "UI/UX Week 1 Wireframes", startDate: "2026-01-14T11:00:00.000Z", endDate: "2026-01-14T13:00:00.000Z", description: "Create homepage wireframes. Design user onboarding flow. Map seller dashboard layout. Prototype product listing pages.", team: "UI/UX", status: "pending" },
                        { id: 5, subject: "Marketing Week 1 Competitor Analysis", startDate: "2026-01-13T14:00:00.000Z", endDate: "2026-01-13T16:00:00.000Z", description: "Research 5 competitor platforms. Analyze their pricing strategies. Study user acquisition methods. Identify market gaps.", team: "Marketing", status: "pending" },
                        { id: 6, subject: "Marketing Week 1 Target Audience", startDate: "2026-01-14T14:00:00.000Z", endDate: "2026-01-14T16:00:00.000Z", description: "Define primary user personas. Research creator demographics. Identify buyer pain points. Create audience segmentation.", team: "Marketing", status: "pending" },
                        { id: 7, subject: "Support Week 1 Helpdesk Setup", startDate: "2026-01-13T16:00:00.000Z", endDate: "2026-01-13T17:30:00.000Z", description: "Choose helpdesk software. Set up ticketing system. Create support categories. Configure automation rules.", team: "Support", status: "planned" },
                        { id: 8, subject: "Support Week 1 Documentation", startDate: "2026-01-14T16:00:00.000Z", endDate: "2026-01-14T17:30:00.000Z", description: "Create documentation structure. Write getting started guides. Develop FAQ templates. Set up knowledge base.", team: "Support", status: "planned" },
                        { id: 9, subject: "Content Week 1 Content Calendar", startDate: "2026-01-13T13:00:00.000Z", endDate: "2026-01-13T15:00:00.000Z", description: "Plan 3-month content calendar. Research trending topics. Schedule blog post topics. Plan social media content.", team: "Content", status: "in-progress" },
                        { id: 10, subject: "Content Week 1 Platform Setup", startDate: "2026-01-14T13:00:00.000Z", endDate: "2026-01-14T15:00:00.000Z", description: "Set up blog platform. Create social media accounts. Configure email newsletter. Set up analytics tracking.", team: "Content", status: "in-progress" },
                        { id: 11, subject: "Full-stack Week 2 Auth API", startDate: "2026-01-20T09:00:00.000Z", endDate: "2026-01-20T11:00:00.000Z", description: "Implement user registration. Create login/logout endpoints. Set up password reset. Configure session management.", team: "Full-Stack", status: "pending" },
                        { id: 12, subject: "Full-stack Week 2 Basic Endpoints", startDate: "2026-01-21T09:00:00.000Z", endDate: "2026-01-21T11:00:00.000Z", description: "Create product API endpoints. Implement user profile endpoints. Build file upload system. Set up basic search functionality.", team: "Full-Stack", status: "pending" },
                        { id: 13, subject: "UI/UX Week 2 Landing Page", startDate: "2026-01-20T11:00:00.000Z", endDate: "2026-01-20T13:00:00.000Z", description: "Design homepage layout. Create hero section. Design feature showcase. Build call-to-action elements.", team: "UI/UX", status: "pending" },
                        { id: 14, subject: "UI/UX Week 2 Onboarding Flows", startDate: "2026-01-21T11:00:00.000Z", endDate: "2026-01-21T13:00:00.000Z", description: "Design user signup flow. Create seller onboarding. Build product upload process. Design dashboard navigation.", team: "UI/UX", status: "pending" },
                        { id: 15, subject: "Marketing Week 2 SEO Strategy", startDate: "2026-01-20T14:00:00.000Z", endDate: "2026-01-20T16:00:00.000Z", description: "Research primary keywords. Optimize website structure. Create meta description strategy. Plan content optimization.", team: "Marketing", status: "pending" },
                        { id: 16, subject: "Marketing Week 2 Social Media", startDate: "2026-01-21T14:00:00.000Z", endDate: "2026-01-21T16:00:00.000Z", description: "Set up business profiles. Create posting schedule. Design brand visuals. Plan engagement strategy.", team: "Marketing", status: "pending" },
                        { id: 17, subject: "Support Week 2 FAQ Database", startDate: "2026-01-20T16:00:00.000Z", endDate: "2026-01-20T17:30:00.000Z", description: "Create common question list. Write detailed answers. Organize by categories. Set up search functionality.", team: "Support", status: "planned" },
                        { id: 18, subject: "Support Week 2 Response Templates", startDate: "2026-01-21T16:00:00.000Z", endDate: "2026-01-21T17:30:00.000Z", description: "Develop email templates. Create chat responses. Make video tutorial outlines. Set up template library.", team: "Support", status: "planned" },
                        { id: 19, subject: "Content Week 2 Blog Posts", startDate: "2026-01-20T13:00:00.000Z", endDate: "2026-01-20T15:00:00.000Z", description: "Write first blog article. Create supporting graphics. Optimize for SEO. Schedule publication.", team: "Content", status: "in-progress" },
                        { id: 20, subject: "Content Week 2 Educational Content", startDate: "2026-01-21T13:00:00.000Z", endDate: "2026-01-21T15:00:00.000Z", description: "Create how-to guides. Make video tutorials. Develop infographics. Plan content series.", team: "Content", status: "in-progress" }
                    ];
                    localStorage.setItem('digihive_tasks', JSON.stringify(initialTasks));
                }
            }

            loadFromStorage(key) { return JSON.parse(localStorage.getItem(`digihive_${key}`) || '[]'); }
            saveToStorage(key, data) {
                const oldData = localStorage.getItem(`digihive_${key}`);
                const newData = JSON.stringify(data);
                if (oldData !== newData) {
                    try {
                        localStorage.setItem(`digihive_${key}`, newData);
                        // Manually dispatch a storage event to ensure all tabs are notified immediately.
                        window.dispatchEvent(new StorageEvent('storage', {
                            key: `digihive_${key}`,
                            newValue: newData,
                            oldValue: oldData,
                            storageArea: localStorage,
                            url: window.location.href,
                        }));
                    } catch (e) {
                        if (e.name === 'QuotaExceededError') {
                            alert('Could not save submission. Your browser storage is full. Please clear some space.');
                        } else {
                            console.error('Error saving to storage:', e);
                        }
                    }
                }
            }
            setupStorageSync() {
                window.addEventListener('storage', (e) => {
                    if (e.key?.startsWith('digihive_')) {
                        const key = e.key.replace('digihive_', '');
                        if (e.newValue !== e.oldValue) {
                            try {
                                const newData = JSON.parse(e.newValue || '[]');
                                this[key] = newData;
                                this.notifyListeners(key, newData);
                            } catch (error) { console.error('Error syncing storage:', error); }
                        }
                    }
                });
            }

            subscribe(key, callback) {
                if (!this.listeners.has(key)) this.listeners.set(key, new Set());
                this.listeners.get(key).add(callback);
                return () => this.listeners.get(key)?.delete(callback);
            }
            notifyListeners(key, data) { this.listeners.get(key)?.forEach(callback => callback(data)); }

            async getUsers() { return [...this.loadFromStorage('users')]; }
            async getComments() { return [...this.loadFromStorage('comments')]; }
            async getSubmissions() { return [...this.loadFromStorage('submissions')]; }
            async getTasks() { return [...this.loadFromStorage('tasks')]; }

            async updateUser(username, updates) {
                const users = this.loadFromStorage('users');
                const userIndex = users.findIndex(u => u.username === username);
                if (userIndex !== -1) {
                    users[userIndex] = { ...users[userIndex], ...updates };
                    this.saveToStorage('users', users);
                    this.notifyListeners('users', users);
                    return users[userIndex];
                }
                return null;
            }
            async addUser(user) {
                const users = this.loadFromStorage('users');
                const newUser = { ...user, isOnline: false, lastLogin: null, lastLogout: null };
                users.push(newUser);
                this.saveToStorage('users', users);
                this.notifyListeners('users', users);
                return newUser;
            }
            async removeUser(username) {
                const users = this.loadFromStorage('users');
                this.saveToStorage('users', users.filter(u => u.username !== username));
                this.notifyListeners('users', this.loadFromStorage('users'));
            }
            async addComment(comment) {
                const comments = this.loadFromStorage('comments');
                const newComment = { ...comment, id: Date.now(), timestamp: new Date().toISOString() };
                comments.unshift(newComment);
                this.saveToStorage('comments', comments);
                this.notifyListeners('comments', comments);
                return newComment;
            }
            async addSubmission(submission) {
                const submissions = this.loadFromStorage('submissions');
                const newSubmission = { ...submission, id: Date.now(), timestamp: new Date().toISOString() };
                submissions.unshift(newSubmission);
                this.saveToStorage('submissions', submissions);
                this.notifyListeners('submissions', submissions);
                return newSubmission;
            }
        }
        const liveDB = new LiveDatabase();

        // --- UTILITIES ---
        function createElement(tag, props, ...children) {
            const element = document.createElement(tag);
            if (props) {
                Object.keys(props).forEach(key => {
                    if (key.startsWith('on') && typeof props[key] === 'function') {
                        element.addEventListener(key.substring(2).toLowerCase(), props[key]);
                    } else if (key === 'disabled' && props[key] === false) {
                        // Don't add disabled attribute if it's false
                    }
                    else {
                        element.setAttribute(key, props[key]);
                    }
                });
            }
            children.forEach(child => {
                if (typeof child === 'string' || typeof child === 'number') {
                    element.appendChild(document.createTextNode(child));
                } else if (child) {
                    element.appendChild(child);
                }
            });
            return element;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, children, size = 'md' }) => {
            const existingModal = document.getElementById('modal-container');
            if (existingModal) existingModal.remove();
            
            if (!isOpen) return null;
            
            const sizeClasses = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl', xl: 'max-w-4xl' };
            const modalContainer = createElement('div', { id: 'modal-container', class: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-fade-in' });
            const modalContent = createElement('div', { class: `bg-white rounded-2xl shadow-xl w-full ${sizeClasses[size]} max-h-[90vh] overflow-y-auto p-6 sm:p-8 relative animate-scale-up` });
            const closeButton = createElement('button', { class: 'absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl transition-colors', onclick: onClose }, '×');
            
            modalContent.appendChild(closeButton);
            if (Array.isArray(children)) {
                children.forEach(child => child && modalContent.appendChild(child));
            } else {
                if (children) modalContent.appendChild(children);
            }
            
            modalContainer.appendChild(modalContent);
            modalContainer.onclick = (e) => { if (e.target === modalContainer) onClose(); };
            
            document.body.appendChild(modalContainer);
            return modalContainer;
        }

        const SyncStatusIndicator = ({ isSyncing, lastSyncTime }) => createElement('div', { class: `fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-2 rounded-lg shadow-lg transition-all duration-300 ${isSyncing ? 'bg-blue-500 text-white animate-pulse-sync' : 'bg-green-500 text-white'} animate-slide-in-right` },
            createElement('i', { class: `fas ${isSyncing ? 'fa-sync-alt fa-spin' : 'fa-check-circle'} mr-1` }),
            createElement('span', { class: 'text-sm font-medium' }, isSyncing ? 'Syncing...' : `Live - ${lastSyncTime}`)
        );

        const TeamPresenceHeader = ({ users = [] }) => {
            const onlineUsers = users.filter(u => u.isOnline);
            const onlineTeamsCount = new Set(onlineUsers.map(u => u.team)).size;
            return createElement('div', { class: 'bg-white rounded-2xl p-4 shadow-sm mb-6' },
                createElement('div', { class: 'flex items-center justify-between flex-wrap gap-4' },
                    createElement('div', { class: 'flex items-center gap-3' },
                        createElement('div', { class: 'flex items-center gap-2' },
                            createElement('div', { class: 'w-3 h-3 rounded-full bg-green-500 animate-pulse' }),
                            createElement('span', { class: 'font-bold text-slate-800' }, 'Live Team Status')
                        ),
                        createElement('span', { class: 'text-sm text-gray-600' }, `${onlineUsers.length} users online • ${onlineTeamsCount} of ${Object.keys(TEAM_MAPPING).length} teams active`)
                    ),
                    createElement('div', { class: 'flex items-center gap-2 flex-wrap' },
                        ...Object.values(TEAM_MAPPING).map(team => {
                            const isOnline = users.some(u => u.team === team.name && u.isOnline);
                            return createElement('div', { key: team.name, title: team.name, class: 'flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-50' },
                                createElement('div', { class: `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-green-500' : 'bg-gray-400'}` }),
                                createElement('span', { class: 'text-sm font-medium text-slate-700' }, team.avatar)
                            );
                        })
                    )
                )
            );
        };

        const CommentsSection = ({ currentUser }) => {
            const container = createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm h-full flex flex-col max-h-[600px]' });
            let comments = [];
            let newComment = '';

            const updateUI = () => {
                container.innerHTML = '';
                container.append(
                    createElement('div', { class: 'flex items-center justify-between mb-4' },
                        createElement('h3', { class: 'text-xl font-bold text-slate-800' }, 'Team Comments'),
                        createElement('div', { class: 'flex items-center gap-2 text-sm text-green-600 bg-green-50 px-2 py-1 rounded-md' },
                            createElement('i', { class: 'fas fa-sync-alt mr-1' }), createElement('span', null, 'Live Updates')
                        )
                    ),
                    createElement('form', { class: 'mb-4 flex gap-3 flex-col sm:flex-row', onsubmit: handleSubmit },
                        createElement('input', { type: 'text', class: 'flex-grow w-full border-2 border-gray-200 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition', placeholder: 'Leave a comment...', value: newComment, oninput: (e) => newComment = e.target.value }),
                        createElement('button', { type: 'submit', class: 'bg-blue-600 text-white font-bold py-3 px-5 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2' },
                            createElement('i', { class: 'fas fa-paper-plane' }), ' Post'
                        )
                    ),
                    renderCommentsList()
                );
                // After re-rendering, set the input value back
                const input = container.querySelector('input');
                if (input) input.value = newComment;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (newComment.trim() === '') return;
                await liveDB.addComment({ username: currentUser.username, team: currentUser.team, text: newComment.trim() });
                newComment = '';
                // The subscription will trigger the updateUI call automatically
            };
            
            const renderCommentsList = () => {
                const commentsList = createElement('div', { class: 'flex-1 overflow-y-auto pr-2 space-y-4' });
                if (comments.length === 0) {
                    commentsList.append(createElement('div', { class: 'text-center text-gray-400 pt-8 flex flex-col items-center' },
                        createElement('i', { class: 'fas fa-comments text-4xl mb-2' }),
                        createElement('p', null, 'No comments yet. Be the first to post!')
                    ));
                } else {
                    comments.forEach(comment => {
                        const teamInfo = TEAM_MAPPING[comment.team];
                        commentsList.append(createElement('div', { class: 'flex items-start gap-3 animate-fade-in' },
                            createElement('div', { class: `w-10 h-10 ${teamInfo.color} rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold text-sm` }, comment.username.substring(0, 2).toUpperCase()),
                            createElement('div', { class: 'flex-1 bg-gray-50 rounded-lg p-3' },
                                createElement('div', { class: 'flex justify-between items-baseline' },
                                    createElement('p', { class: 'font-bold text-slate-700' }, `${comment.username} `, createElement('span', { class: 'font-normal text-sm text-gray-500 ml-1.5' }, `(${comment.team})`)),
                                    createElement('p', { class: 'text-xs text-gray-400' }, new Date(comment.timestamp).toLocaleString())
                                ),
                                createElement('p', { class: 'text-sm text-gray-800 mt-1 break-words' }, comment.text)
                            )
                        ));
                    });
                }
                return commentsList;
            };

            liveDB.subscribe('comments', (data) => {
                comments = data;
                updateUI();
            });
            liveDB.getComments().then(data => {
                comments = data;
                updateUI();
            });
            return container;
        };

        const DashboardPage = ({ currentUser, triggerSync, users, comments, submissions, tasks }) => {
            const container = createElement('div', { class: 'space-y-8' });
            let isModalOpen = false;
            let submissionSuccess = false;
            let selectedFile = null;

            const updateUI = () => {
                container.innerHTML = '';
                const upcomingTasks = tasks.filter(task => new Date(task.startDate) > new Date()).length;
                const onlineNow = users.filter(u => u.isOnline).length;
                const stats = [
                    { icon: 'fa-list-check', value: upcomingTasks, label: 'Upcoming Tasks', color: 'bg-blue-500' },
                    { icon: 'fa-check-double', value: submissions.length, label: 'Total Submissions', color: 'bg-violet-500' },
                    { icon: 'fa-comments', value: comments.length, label: 'Team Comments', color: 'bg-teal-500' },
                    { icon: 'fa-users', value: onlineNow, label: 'Online Now', color: 'bg-amber-500' },
                ];
                container.append(
                    TeamPresenceHeader({ users }),
                    createElement('div', { class: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6' },
                        ...stats.map(stat => createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm' },
                            createElement('div', { class: `w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl ${stat.color}` }, createElement('i', { class: `fas ${stat.icon}` })),
                            createElement('div', { class: 'mt-4' },
                                createElement('p', { class: 'text-4xl font-bold text-slate-800' }, stat.value),
                                createElement('p', { class: 'text-md text-gray-500 font-medium' }, stat.label)
                            )
                        ))
                    ),
                    createElement('div', { class: 'grid grid-cols-1 lg:grid-cols-3 gap-8' },
                        createElement('div', { class: 'lg:col-span-2' }, CommentsSection({ currentUser })),
                        createElement('div', { class: 'lg:col-span-1 space-y-8' },
                            createElement('div', { class: 'bg-white rounded-2xl p-6 shadow-sm' },
                                createElement('h3', { class: 'text-xl font-bold text-slate-800 mb-4' }, 'Submit Your Report'),
                                createElement('button', { class: 'w-full bg-blue-100 text-blue-600 font-bold p-6 rounded-lg text-center group hover:bg-blue-500 hover:text-white transition-all duration-300', onclick: openModal },
                                    createElement('i', { class: 'fas fa-cloud-upload-alt text-4xl mb-2 text-blue-500 group-hover:text-white transition-colors' }),
                                    createElement('p', null, 'Submit Weekly Report')
                                )
                            )
                        )
                    )
                );
                renderModal();
            };
            
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                const display = document.getElementById('file-name-display');
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert('File is too large! Maximum size is 2MB.');
                        e.target.value = '';
                        selectedFile = null;
                        if(display) display.textContent = '';
                    } else {
                        selectedFile = file;
                        if(display) display.textContent = `Selected: ${file.name}`;
                    }
